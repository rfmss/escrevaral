<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Encore — Banca de Orações Adjetivas</title>
    <link rel="stylesheet" href="css/probe.css">
    <style>
        .simple-page { text-align: center; padding-top: 72px; }
        .simple-page h1 { font-size: 34px; }
        .simple-page .purpose { margin: 0 auto 32px; max-width: 520px; }
        #start-test { display: block; font-size: 21px; margin: 0 auto 24px; min-height: 66px; width: 100%; }
        .test-result { background: #efebdc; border: 1px solid #b9b29f; margin-top: 20px; padding: 28px 18px; }
        .result-word { font-family: "Courier New", Courier, monospace; font-size: 34px; margin-bottom: 8px; }
        .result-detail { color: #5b574d; margin-bottom: 10px; }
        .progress-line { height: 6px; background: #c8c1ae; margin: 20px 0; overflow: hidden; }
        .progress-fill { background: #9a5b38; height: 6px; width: 0; }
        .small-note { color: #6e685b; font-family: "Courier New", Courier, monospace; font-size: 13px; margin-bottom: 0; }
    </style>
</head>
<body>
    <main class="page simple-page">
        <p class="eyebrow">ESCREVARAL ENCORE</p>
        <h1>Orações adjetivas</h1>
        <p class="purpose">Um toque. 19 casos. Uma cápsula por vez.</p>
        <button id="start-test" type="button">Testar agora</button>
        <div id="result-box" class="test-result" hidden>
            <p id="result-word" class="result-word">Testando…</p>
            <div class="progress-line"><div id="progress-fill" class="progress-fill"></div></div>
            <p id="result-detail" class="result-detail"></p>
            <p id="technical-note" class="small-note"></p>
        </div>
    </main>
    <noscript>Este teste precisa de JavaScript.</noscript>
    <script src="js/relative-clause-tranche-test.js"></script>
</body>
</html>
