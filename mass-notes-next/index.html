<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee5" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/svg+xml" href="./brand/escrevaral-favicon.svg" />
    <link rel="shortcut icon" href="./brand/escrevaral-favicon.svg" />
    <title>Escrevaral</title>
    <style>
      .preview-fallback {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
        color: #171a1d;
        background: #f3eee5;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .preview-logo {
        display: block;
        width: min(220px, 62vw);
        height: auto;
        margin: 0 auto 0.2rem;
      }
      .preview-fallback > strong {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .preview-fallback > span {
        max-width: 36rem;
        color: #5e6468;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .storage-copy {
        max-width: 42rem;
        margin: 0.35rem auto 0.15rem;
        color: #5e6468;
        font-size: 0.95rem;
        line-height: 1.55;
      }
      .storage-copy b {
        display: block;
        margin-bottom: 0.25rem;
        color: #171a1d;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="preview-fallback" role="status" data-preview-fallback>
        <img class="preview-logo" src="./brand/escrevaral-logo.svg" alt="" width="300" height="180" />
        <strong>Escrevaral</strong>
        <p class="storage-copy">
          <b>Seus textos são salvos automaticamente neste navegador.</b>
          Exporte uma cópia de segurança regularmente para proteger seu acervo.
        </p>
        <span data-preview-status>Abrindo a oficina de escrita…</span>
      </main>
    </div>
    <noscript>Esta preview precisa de JavaScript para abrir o editor.</noscript>
    <script>
      window.setTimeout(() => {
        const fallback = document.querySelector('[data-preview-status]')
        if (fallback) fallback.textContent = 'A preview não conseguiu carregar. Atualize a página ou consulte o estado do gate no pull request.'
      }, 12000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
