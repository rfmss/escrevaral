current_research_question:
  id: m1-r0-subject-boundaries
  question: >-
    Como distinguir sujeito expresso, sujeito recuperável ou oculto,
    sujeito indeterminado e oração sem sujeito sem depender apenas
    da forma isolada do verbo?
  status: source_mapping
  production_engine_open: false
  development_corpus_open: false
  evaluation_corpus_open: false
  human_validation_open: false

sources:
  - id: bechara-licoes-20e
    title: Lições de Português pela análise sintática
    authors: [Evanildo Bechara]
    edition: 20a edição revista e ampliada
    year: 2018
    isbn: "9788520940808"
    language_scope: português, com uso prioritário como referência para pt-BR
    authority_role: primary_syntax
    research_status: consulted_current_question
    relevant_locations:
      - "Lição II — termos essenciais da oração"
      - "Lição IV, §§ 1–4 — sujeito indeterminado, oração sem sujeito e verbos impessoais"
      - "marcadores digitais [10]–[11] no arquivo privado"
    known_value:
      - separa sujeito indeterminado de oração sem sujeito
      - inclui intenção comunicativa na indeterminação
      - relaciona impessoalidade à ausência de atribuição a um participante
      - oferece contraste entre haver e existir
    cautions:
      - orientação normativa e tradição terminológica precisam ser separadas de descrição de uso
      - exemplos da obra são material de estudo, não corpus distribuível
    rights:
      protected_work: true
      database_reconstruction_allowed: false
      repository_storage_allowed: false
      use_mode: private_consultation_and_original_synthesis

  - id: cunha-cintra-nova-gramatica-7e
    title: Nova gramática do português contemporâneo
    authors: [Celso Cunha, Lindley Cintra]
    edition: 7a edição, 2a impressão
    year: 2017
    isbn: "9788583000310"
    language_scope: português pluricêntrico, com seções e exemplos brasileiros e europeus
    authority_role: primary_comparative_grammar
    research_status: consulted_current_question
    relevant_locations:
      - "pp. 138–145 — representação do sujeito, sujeito oculto, indeterminado e oração sem sujeito"
      - "pp. 141–142 — sujeito oculto determinado"
      - "p. 142 — sujeito indeterminado"
      - "pp. 143–144 — oração sem sujeito"
    known_value:
      - define sujeito oculto como identificável por desinência ou contexto contíguo
      - restringe a seção de indeterminação aos padrões de terceira pessoa do plural e se impessoal
      - documenta ter existencial na linguagem coloquial do Brasil e em usos literários
      - registra usos figurados de verbos meteorológicos com sujeito expresso
    cautions:
      - mistura variedades nacionais e épocas; todo uso precisa de marcação de variante e registro
      - exemplos da obra são material de estudo, não corpus distribuível
    rights:
      protected_work: true
      database_reconstruction_allowed: false
      repository_storage_allowed: false
      use_mode: private_consultation_and_original_synthesis

