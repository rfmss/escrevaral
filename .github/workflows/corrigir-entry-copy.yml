name: Correção da copy de entrada

on:
  push:
    branches:
      - refactor/argila-entry-return
    paths:
      - "scripts/corrigir-entry-copy.py"
      - ".github/workflows/corrigir-entry-copy.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: refactor/argila-entry-return
      - run: python3 scripts/corrigir-entry-copy.py
      - run: |
          git diff --check
          grep -q '<h2 class="ob-pillar-title">Abra uma página.</h2>' index.html
          grep -q '<h2 class="ob-pillar-title">Conhecer a oficina</h2>' index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(entry): alinha títulos à direção Argila" || exit 0
          git push origin HEAD:refactor/argila-entry-return