name: Corrigir título global da entrada

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/nomenclatura-publica-escrevaral'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nomenclatura-publica-escrevaral
          fetch-depth: 0

      - name: Rebaixar logotipo global sem alterar o visual
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<h1 class="ob-logo">Escrevaral</h1>'
          new = '<p class="ob-logo">Escrevaral</p>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Esperada 1 ocorrência do H1 global; encontradas {count}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/temp-fix-onboarding-heading.yml').unlink()

      - name: Registrar correção
        run: |
          git config user.name "rfmss"
          git config user.email "198406865+rfmss@users.noreply.github.com"
          git add -A
          git commit -m "fix(a11y): não expor marca global como H1"
          git push origin HEAD:fix/nomenclatura-publica-escrevaral