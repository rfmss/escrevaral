name: Validação de foco e regressão

on:
  pull_request:
    branches:
      - main
    paths:
      - "styles.css"
      - "css/**"
      - "index.html"
      - "scripts/auditor-focus-a11y.py"
      - "scripts/auditor-console-errors.py"
      - "scripts/auditor-overflow-mobile.py"
      - "scripts/comparar-golden.py"
      - "scripts/smoke-live.py"
      - ".github/workflows/a11y-focus-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a11y-focus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Validar sintaxe do novo auditor
        run: python -m py_compile scripts/auditor-focus-a11y.py

      - name: Iniciar servidor local
        run: |
          python3 -m http.server 8799 > /tmp/escrevaral-http.log 2>&1 &
          echo $! > /tmp/escrevaral-http.pid
          for tentativa in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8799/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/escrevaral-http.log
          exit 1

      - name: Guarda de regressão das engines
        id: golden
        continue-on-error: true
        run: python3 scripts/comparar-golden.py

      - name: Auditor de overflow mobile
        id: overflow
        continue-on-error: true
        run: python3 scripts/auditor-overflow-mobile.py

      - name: Auditor de erros no console
        id: console
        continue-on-error: true
        run: python3 scripts/auditor-console-errors.py

      - name: Auditor de foco por teclado
        id: focus
        continue-on-error: true
        run: |
          python3 scripts/auditor-focus-a11y.py \
            --base-url http://127.0.0.1:8799 \
            --output-dir reports/auditoria/focus-a11y-artifacts

      - name: Smoke test do site publicado
        id: live
        continue-on-error: true
        run: python3 scripts/smoke-live.py

      - name: Preparar evidências da execução atual
        if: always()
        run: |
          DATA=$(date +%Y-%m-%d)
          DESTINO=artifacts/validation
          mkdir -p "$DESTINO"

          cp -R reports/auditoria/focus-a11y-artifacts "$DESTINO/" 2>/dev/null || true
          cp "reports/auditoria/overflow-mobile-${DATA}.md" "$DESTINO/" 2>/dev/null || true
          cp "reports/auditoria/overflow-mobile-${DATA}.json" "$DESTINO/" 2>/dev/null || true
          cp "reports/auditoria/console-errors-${DATA}.md" "$DESTINO/" 2>/dev/null || true
          cp "reports/auditoria/console-errors-${DATA}.json" "$DESTINO/" 2>/dev/null || true
          cp "reports/auditoria/smoke-live-${DATA}.md" "$DESTINO/" 2>/dev/null || true
          cp "reports/agente/${DATA}.md" "$DESTINO/" 2>/dev/null || true
          cp "reports/agente/${DATA}.json" "$DESTINO/" 2>/dev/null || true
          cp /tmp/escrevaral-http.log "$DESTINO/" 2>/dev/null || true

          find "$DESTINO" -type f -maxdepth 4 -print

      - name: Guardar relatórios e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-focus-e-regressao-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/validation/**

      - name: Consolidar resultado
        if: always()
        run: |
          echo "golden=${{ steps.golden.outcome }}"
          echo "overflow=${{ steps.overflow.outcome }}"
          echo "console=${{ steps.console.outcome }}"
          echo "focus=${{ steps.focus.outcome }}"
          echo "live=${{ steps.live.outcome }}"

          falhou=0
          for resultado in \
            "${{ steps.golden.outcome }}" \
            "${{ steps.overflow.outcome }}" \
            "${{ steps.console.outcome }}" \
            "${{ steps.focus.outcome }}" \
            "${{ steps.live.outcome }}"; do
            if [ "$resultado" != "success" ]; then
              falhou=1
            fi
          done

          if [ "$falhou" -ne 0 ]; then
            echo "Uma ou mais validações falharam. Consulte os logs e o artefato gerado."
            exit 1
          fi

          echo "Todas as validações passaram."
