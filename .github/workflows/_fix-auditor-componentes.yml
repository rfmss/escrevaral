name: Correção transitória do auditor de componentes

on:
  push:
    branches:
      - agent/design-system-components-foundation
    paths:
      - "scripts/_corrigir-seletor-auditor-componentes.py"
      - ".github/workflows/_fix-auditor-componentes.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          ref: agent/design-system-components-foundation
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Aplicar correção exata
        run: python scripts/_corrigir-seletor-auditor-componentes.py

      - name: Registrar correção e remover rotina transitória
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Corrige seletor do auditor de componentes"
          git push origin HEAD:agent/design-system-components-foundation
