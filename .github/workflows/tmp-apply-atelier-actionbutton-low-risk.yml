name: Aplicar migração baixa do Ateliê

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/atelier-actionbutton-low-risk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atelier-actionbutton-low-risk
          fetch-depth: 0

      - name: Aplicar patch aprovado
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_version = "20260727-master-reset-hidden-v1"
          new_version = "20260727-atelier-actionbutton-low-risk-v1"

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")

          replacements = [
              (
                  '''                    <button type="button" class="rights-search-clear" data-rights-search-clear aria-label="Limpar busca" hidden>\n                      <span class="material-symbols-outlined">close</span>\n                    </button>''',
                  '''                    <button type="button" class="action-button rights-search-clear" data-rights-search-clear aria-label="Limpar busca" hidden data-component="action-button" data-variant="ghost" data-size="compact" data-icon-only="true">\n                      <span class="material-symbols-outlined action-button__icon" aria-hidden="true">close</span>\n                    </button>''',
              ),
              (
                  '''                    <button class="secondary-button" data-action="scroll-rights">\n                      <span class="material-symbols-outlined">policy</span>\n                      Ver cuidados\n                    </button>''',
                  '''                    <button class="action-button" data-action="scroll-rights" data-component="action-button" data-variant="secondary">\n                      <span class="material-symbols-outlined action-button__icon" aria-hidden="true">policy</span>\n                      Ver cuidados\n                    </button>''',
              ),
              (
                  '''                  <a href="./anatomia-do-livro.html" target="_blank" class="secondary-button academy-anatomy-btn">\n                    <span class="material-symbols-outlined">menu_book</span>\n                    Abrir Anatomia do Livro\n                  </a>''',
                  '''                  <a href="./anatomia-do-livro.html" target="_blank" class="action-button academy-anatomy-btn" data-component="action-button" data-variant="secondary">\n                    <span class="material-symbols-outlined action-button__icon" aria-hidden="true">menu_book</span>\n                    Abrir Anatomia do Livro\n                  </a>''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Trecho esperado ocorreu {count} vez(es), esperado 1")
              text = text.replace(old, new, 1)

          if old_version not in text:
              raise SystemExit("Versão anterior não encontrada em index.html")
          text = text.replace(old_version, new_version)
          index.write_text(text, encoding="utf-8")

          sw = Path("service-worker.js")
          sw_text = sw.read_text(encoding="utf-8")
          if 'const CACHE_NAME = "vereda-offline-v966";' not in sw_text:
              raise SystemExit("Cache v966 não encontrado")
          sw_text = sw_text.replace(
              'const CACHE_NAME = "vereda-offline-v966";',
              'const CACHE_NAME = "vereda-offline-v967";',
              1,
          )
          if old_version not in sw_text:
              raise SystemExit("Versão anterior não encontrada no service worker")
          sw_text = sw_text.replace(old_version, new_version)
          sw.write_text(sw_text, encoding="utf-8")

          for filename in ["ui-dialog.js", "css/14-archive-inspector.css", "css/wood-icons.css"]:
              path = Path(filename)
              current = path.read_text(encoding="utf-8")
              if old_version not in current:
                  raise SystemExit(f"Versão anterior não encontrada em {filename}")
              path.write_text(current.replace(old_version, new_version), encoding="utf-8")

          expected = {
              'data-rights-search-clear aria-label="Limpar busca" hidden data-component="action-button" data-variant="ghost" data-size="compact" data-icon-only="true"': 1,
              'data-action="scroll-rights" data-component="action-button" data-variant="secondary"': 1,
              'href="./anatomia-do-livro.html" target="_blank" class="action-button academy-anatomy-btn" data-component="action-button" data-variant="secondary"': 1,
          }
          final_index = index.read_text(encoding="utf-8")
          for needle, wanted in expected.items():
              found = final_index.count(needle)
              if found != wanted:
                  raise SystemExit(f"Contrato final inválido para {needle!r}: {found}")

          for filename in ["index.html", "service-worker.js", "ui-dialog.js", "css/14-archive-inspector.css", "css/wood-icons.css"]:
              if old_version in Path(filename).read_text(encoding="utf-8"):
                  raise SystemExit(f"Versão antiga ainda presente em {filename}")
          PY

          mapfile -t changed < <(git diff --name-only)
          expected=(css/14-archive-inspector.css css/wood-icons.css index.html service-worker.js ui-dialog.js)
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git diff --check

      - name: Publicar commit de produto
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch já aplicado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js ui-dialog.js css/14-archive-inspector.css css/wood-icons.css
          git commit -m "Migra ações de baixo risco do Ateliê para ActionButton"
          git push origin HEAD:agent/atelier-actionbutton-low-risk
