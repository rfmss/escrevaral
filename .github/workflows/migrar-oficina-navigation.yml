name: Sincronização da navegação Oficina

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/migrar-oficina-navigation.py"
      - ".github/workflows/migrar-oficina-navigation.yml"
      - "css/19-oficina-navigation.css"
      - "oficina-navigation-controller.js"

permissions:
  contents: write

jobs:
  migrar:
    if: github.head_ref == 'refactor/argila-oficina-nav'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          ref: refactor/argila-oficina-nav
          fetch-depth: 0

      - name: Aplicar migração
        run: python3 scripts/migrar-oficina-navigation.py

      - name: Verificar distribuição
        run: |
          python3 scripts/auditor-asset-version.py
          git diff --check
          grep -q "20260725-oficina-nav" index.html
          grep -q "oficina-navigation-controller.js" index.html
          grep -q "vereda-offline-v948" service-worker.js
          grep -q "19-oficina-navigation.css" service-worker.js

      - name: Registrar migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(navegação): distribua Oficina como segundo nível" || exit 0
          git push origin HEAD:refactor/argila-oficina-nav
