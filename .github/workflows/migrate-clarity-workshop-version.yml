name: Migração de versão — Oficina e Autoria

on:
  push:
    branches:
      - clarity/desktop-workshop-authorship
    paths:
      - scripts/migrate-clarity-workshop-version.py
      - .github/workflows/migrate-clarity-workshop-version.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          ref: clarity/desktop-workshop-authorship
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Distribuir Oficina e Autoria
        run: python3 scripts/migrate-clarity-workshop-version.py

      - name: Validar versão
        run: python3 scripts/auditor-asset-version.py
        env:
          GITHUB_BASE_REF: main

      - name: Registrar e limpar migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css service-worker.js ui-dialog.js
          git rm scripts/migrate-clarity-workshop-version.py .github/workflows/migrate-clarity-workshop-version.yml
          git commit -m "build(clarity): distribua Oficina e Autoria desktop"
          git push origin HEAD:clarity/desktop-workshop-authorship
