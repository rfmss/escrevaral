name: Operação temporária — inventário da Fase 3

on:
  push:
    branches:
      - agent/relatorio-design-system-fase-3

permissions:
  contents: write

jobs:
  inventariar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2

      - name: Instalar parsers temporários
        run: |
          npm install --prefix /tmp/phase3-tools postcss@8.4.49
          python3 -m pip install beautifulsoup4==4.12.3

      - name: Mapear HTML e JavaScript
        run: |
          mkdir -p _tmp_phase3
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import Counter, defaultdict
          from pathlib import Path
          from bs4 import BeautifulSoup

          SCREENS = {
              "editor": ["editor", "writing", "paper", "mesa", "manuscript", "format-bar", "toolbar"],
              "acervo": ["archive", "acervo"],
              "oficina": ["workshop", "oficina", "atelie", "ateliê", "academy", "craft", "create-note", "create-cat"],
              "palavras": ["palavra", "palavras", "lexical", "word-"],
              "rimas": ["rima", "rimas", "rhyme"],
              "vocabulario": ["vocab", "vocabulário", "vocabulario"],
              "leituras": ["leitura", "leituras", "reading", "reader"],
              "pratica": ["prática", "pratica", "practice", "treino", "training", "exercise"],
              "autoria": ["autoria", "authorship", "certificate", "proof-"],
              "painel-linguistico": ["lingu", "inspector", "analysis", "grammar", "syntax", "precision", "pontua", "voice", "rights", "decolonial"],
          }

          index_path = Path("index.html")
          index_text = index_path.read_text(encoding="utf-8")
          index_lines = index_text.splitlines()
          soup = BeautifulSoup(index_text, "html.parser")

          html_result = {}
          for screen, terms in SCREENS.items():
              line_matches = []
              for number, line in enumerate(index_lines, 1):
                  lower = line.casefold()
                  if any(term.casefold() in lower for term in terms):
                      line_matches.append({"line": number, "text": line.strip()[:500]})

              elements = []
              seen = set()
              for tag in soup.find_all(True):
                  attrs_text = " ".join(
                      [tag.name]
                      + [str(value) for value in tag.attrs.values()]
                      + [tag.get_text(" ", strip=True)[:180]]
                  ).casefold()
                  if not any(term.casefold() in attrs_text for term in terms):
                      continue
                  data_attrs = {key: value for key, value in tag.attrs.items() if key.startswith("data-")}
                  item = {
                      "tag": tag.name,
                      "line": getattr(tag, "sourceline", None),
                      "id": tag.get("id"),
                      "class": tag.get("class", []),
                      "role": tag.get("role"),
                      "aria_label": tag.get("aria-label"),
                      "data": data_attrs,
                      "text": tag.get_text(" ", strip=True)[:240],
                  }
                  key = json.dumps(item, ensure_ascii=False, sort_keys=True)
                  if key not in seen:
                      elements.append(item)
                      seen.add(key)
              html_result[screen] = {
                  "line_matches": line_matches,
                  "elements": elements,
              }

          Path("_tmp_phase3/html-map.json").write_text(
              json.dumps(html_result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          js_files = sorted(path for path in Path(".").rglob("*.js") if ".git" not in path.parts)
          js_result = {}
          for screen, terms in SCREENS.items():
              files = defaultdict(list)
              selectors = Counter()
              formatting = []
              for path in js_files:
                  try:
                      lines = path.read_text(encoding="utf-8").splitlines()
                  except UnicodeDecodeError:
                      continue
                  for number, line in enumerate(lines, 1):
                      lower = line.casefold()
                      if any(term.casefold() in lower for term in terms):
                          files[path.as_posix()].append({"line": number, "text": line.strip()[:500]})
                      if "Intl.NumberFormat" in line or ".toLocaleString" in line or "toLocaleString(" in line:
                          if any(term.casefold() in "\n".join(lines[max(0, number-8):number+7]).casefold() for term in terms):
                              formatting.append({"file": path.as_posix(), "line": number, "text": line.strip()[:500]})
                      for match in re.finditer(r"(?:querySelector|querySelectorAll|closest|matches)\(\s*['\"]([^'\"]+)", line):
                          selector = match.group(1)
                          if any(term.casefold() in selector.casefold() for term in terms):
                              selectors[selector] += 1
              js_result[screen] = {
                  "files": dict(files),
                  "selectors": selectors.most_common(),
                  "number_formatting": formatting,
              }

          Path("_tmp_phase3/js-map.json").write_text(
              json.dumps(js_result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Mapear CSS por tela
        run: |
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const postcss = require('/tmp/phase3-tools/node_modules/postcss');

          const screens = {
            editor: ['editor', 'writing', 'paper', 'mesa', 'manuscript', 'format-bar', 'fmt-', 'toolbar'],
            acervo: ['archive', 'acervo'],
            oficina: ['workshop', 'oficina', 'atelie', 'academy', 'craft', 'create-note', 'create-cat'],
            palavras: ['palavra', 'lexical', 'word-'],
            rimas: ['rima', 'rhyme'],
            vocabulario: ['vocab'],
            leituras: ['leitura', 'reading', 'reader'],
            pratica: ['pratica', 'practice', 'treino', 'training', 'exercise'],
            autoria: ['autoria', 'authorship', 'certificate', 'proof-'],
            'painel-linguistico': ['lingu', 'inspector', 'analysis', 'grammar', 'syntax', 'precision', 'punct', 'voice', 'rights', 'decolonial'],
          };

          const categoryFor = (prop, value, selector) => {
            const p = prop.toLowerCase();
            const v = value.toLowerCase();
            const s = selector.toLowerCase();
            if (/color|background|border|outline|shadow|fill|stroke/.test(p) && /#[0-9a-f]{3,8}\b|rgba?\(|hsla?\(|\bwhite\b|\bblack\b|linear-gradient|radial-gradient/.test(v)) return 'cor';
            if (/font-family|font-size|font-weight|font-style|line-height|letter-spacing|text-transform/.test(p) && !/var\(--/.test(v)) return 'tipografia';
            if (/^(margin|padding|gap|row-gap|column-gap|inset|top|right|bottom|left|min-width|max-width|width|min-height|max-height|height)$/.test(p) && /(?:^|\s|\()[-+]?\d*\.?\d+(?:px|rem|em|vw|vh|dvw|dvh|%|ch|mm)\b/.test(v) && !/var\(--/.test(v)) return 'espacamento';
            if (/toast|banner|alert|notice|nudge/.test(s)) return 'aviso-global';
            if (/button|btn|\.tab\b|\[role=["']button/.test(s)) return 'botao';
            if (/stat|metric|count|badge|pill|score|progress/.test(s)) return 'estatistica';
            if (/input|textarea|select|form|field|placeholder/.test(s)) return 'formulario';
            return null;
          };

          const allFiles = [];
          const walk = dir => {
            for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith('.css')) allFiles.push(full.replace(/\\/g, '/'));
            }
          };
          walk('css');
          for (const extra of ['styles.css', 'vereda-editorial.css']) if (fs.existsSync(extra)) allFiles.push(extra);
          allFiles.sort();

          const result = {};
          for (const screen of Object.keys(screens)) {
            result[screen] = {
              files: {},
              token_usage: {},
              hardcoded: [],
              component_selectors: {botao: [], estatistica: [], formulario: [], 'aviso-global': []},
              responsive_rules: [],
              vereda_rules: [],
            };
          }

          for (const file of allFiles) {
            const text = fs.readFileSync(file, 'utf8');
            let root;
            try { root = postcss.parse(text, {from: file}); }
            catch (error) { console.error(`Falha ao analisar ${file}: ${error.message}`); process.exit(1); }

            root.walkRules(rule => {
              const selector = rule.selector || '';
              const media = rule.parent && rule.parent.type === 'atrule' && rule.parent.name === 'media' ? rule.parent.params : null;
              const line = rule.source && rule.source.start ? rule.source.start.line : null;
              const scopeText = `${file} ${selector}`.toLowerCase();

              for (const [screen, terms] of Object.entries(screens)) {
                if (!terms.some(term => scopeText.includes(term.toLowerCase()))) continue;
                const bucket = result[screen];
                bucket.files[file] = (bucket.files[file] || 0) + 1;

                rule.walkDecls(decl => {
                  for (const match of decl.value.matchAll(/var\((--[a-z0-9-]+)/gi)) {
                    bucket.token_usage[match[1]] = (bucket.token_usage[match[1]] || 0) + 1;
                  }
                  const category = categoryFor(decl.prop, decl.value, selector);
                  if (category) {
                    bucket.hardcoded.push({file, line: decl.source.start.line, selector, property: decl.prop, value: decl.value, category, theme: selector.includes('[data-theme="scriptorium"]') ? 'Vereda' : 'base/Alvorada'});
                  }
                });

                const selectorType =
                  /toast|banner|alert|notice|nudge/i.test(selector) ? 'aviso-global' :
                  /button|btn|\.tab\b|\[role=["']button/i.test(selector) ? 'botao' :
                  /stat|metric|count|badge|pill|score|progress/i.test(selector) ? 'estatistica' :
                  /input|textarea|select|form|field|placeholder/i.test(selector) ? 'formulario' : null;
                if (selectorType) bucket.component_selectors[selectorType].push({file, line, selector});
                if (media) bucket.responsive_rules.push({file, line, media, selector});
                if (selector.includes('[data-theme="scriptorium"]')) bucket.vereda_rules.push({file, line, selector});
              }
            });
          }

          for (const [screen, bucket] of Object.entries(result)) {
            bucket.token_usage = Object.fromEntries(Object.entries(bucket.token_usage).sort((a,b) => b[1]-a[1]));
            for (const key of Object.keys(bucket.component_selectors)) {
              const seen = new Set();
              bucket.component_selectors[key] = bucket.component_selectors[key].filter(item => {
                const id = `${item.file}:${item.line}:${item.selector}`;
                if (seen.has(id)) return false;
                seen.add(id); return true;
              });
            }
            fs.writeFileSync(`_tmp_phase3/css-${screen}.json`, JSON.stringify(bucket, null, 2) + '\n');
          }
          JS

      - name: Resumir arquivos e valores globais
        run: |
          python3 - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          css_paths = sorted(Path("css").rglob("*.css")) + [Path("styles.css")]
          css_paths = [path for path in css_paths if path.exists()]
          colors = Counter()
          fonts = Counter()
          radii = Counter()
          spacing = Counter()
          for path in css_paths:
              text = path.read_text(encoding="utf-8")
              colors.update(value.lower() for value in re.findall(r"#[0-9a-fA-F]{3,8}\b|rgba?\([^\)]*\)|hsla?\([^\)]*\)", text))
              fonts.update(value.strip() for value in re.findall(r"font-family\s*:\s*([^;{}]+)", text))
              radii.update(value.strip() for value in re.findall(r"border-radius\s*:\s*([^;{}]+)", text))
              spacing.update(value.strip() for value in re.findall(r"(?:gap|padding|margin)\s*:\s*([^;{}]+)", text) if "var(" not in value)

          result = {
              "css_files": len(css_paths),
              "top_colors": colors.most_common(120),
              "font_families": fonts.most_common(),
              "border_radii": radii.most_common(80),
              "spacing_values": spacing.most_common(120),
          }
          Path("_tmp_phase3/global-values.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Registrar inventário temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmp_phase3
          git commit -m "Registra inventário temporário da Fase 3"
          git push origin "HEAD:${GITHUB_REF_NAME}"
