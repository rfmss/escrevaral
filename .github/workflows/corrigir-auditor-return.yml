name: Correção do auditor de retorno

on:
  push:
    branches:
      - refactor/argila-entry-return
    paths:
      - "scripts/corrigir-auditor-return.py"
      - ".github/workflows/corrigir-auditor-return.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: refactor/argila-entry-return
      - run: python3 scripts/corrigir-auditor-return.py
      - run: |
          python3 -m py_compile scripts/auditor-entry-argila.py
          git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(test): registra retorno oculto sem abortar" || exit 0
          git push origin HEAD:refactor/argila-entry-return