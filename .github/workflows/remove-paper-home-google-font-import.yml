name: Remove Paper Home Remote Font Import

on:
  push:
    branches: [feat/escrevaral-paper-home]
    paths:
      - ".github/workflows/remove-paper-home-google-font-import.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Remover import remoto e provar substituição local
        run: |
          set -euo pipefail
          file="mass-notes-next/src/styles/theme-escrevaral-reference.css"
          python - <<'PY'
          from pathlib import Path
          path = Path('mass-notes-next/src/styles/theme-escrevaral-reference.css')
          text = path.read_text()
          remote = "@import url('https://fonts.googleapis.com/css2?family=Anton&family=Literata:opsz,wght@7..72,400;7..72,600&family=Oswald:wght@400;500;600;700&display=swap');\n\n"
          if remote not in text:
              raise SystemExit('Import remoto esperado não encontrado; patch recusado.')
          path.write_text(text.replace(remote, '', 1))
          PY
          ! grep -q 'fonts.googleapis.com\|fonts.gstatic.com' "$file"
          grep -q "theme-escrevaral-fonts.css" mass-notes-next/src/main.tsx

      - name: Commitar patch e remover bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/remove-paper-home-google-font-import.yml
          git add -A
          git commit -m "fix: remover Google Fonts do runtime da Paper Home"
          git push origin HEAD:feat/escrevaral-paper-home
