name: Validação da Clareza do Acervo desktop

on:
  pull_request:
    branches: [main]
    paths:
      - "css/21-product-clarity-archive.css"
      - "archive-clarity-controller.js"
      - "product-clarity-controller.js"
      - "styles.css"
      - "service-worker.js"
      - "index.html"
      - "ui-dialog.js"
      - "scripts/auditor-product-clarity-archive.py"
      - ".github/workflows/product-clarity-archive-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-clarity-archive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar sintaxe
        run: python -m py_compile scripts/auditor-product-clarity-archive.py

      - name: Servir branch
        run: |
          python -m http.server 8799 > /tmp/escrevaral-archive-server.log 2>&1 &
          for tentativa in {1..30}; do
            curl --fail --silent http://127.0.0.1:8799/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/escrevaral-archive-server.log
          exit 1

      - name: Auditar Acervo desktop
        run: python scripts/auditor-product-clarity-archive.py

      - name: Guardar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-clarity-archive-${{ github.run_id }}
          path: reports/auditoria/product-clarity-archive-artifacts/
          retention-days: 14
