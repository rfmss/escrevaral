name: Aplicar migração ActionButton do Acervo v3

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  aplicar:
    if: github.head_ref == 'agent/archive-actionbutton-low-risk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: agent/archive-actionbutton-low-risk
          fetch-depth: 0

      - name: Aplicar patch aprovado
        shell: python
        run: |
          from pathlib import Path
          import re

          OLD = '20260726-syntax-token-palette-v1'
          NEW = '20260726-archive-actionbutton-low-risk-v1'

          def visible(body):
              return ' '.join(re.sub(r'<[^>]+>', ' ', body).split())

          def migrate(path, specs):
              text = Path(path).read_text(encoding='utf-8')
              for marker, label, old_class, variant, size, icon_only in specs:
                  pattern = re.compile(r'<button(?P<attrs>[^>]*)>(?P<body>.*?)</button>', re.S)
                  hits = [m for m in pattern.finditer(text) if marker in m.group('attrs') and visible(m.group('body')) == label]
                  if len(hits) != 1:
                      raise SystemExit(f'{path} {label}: esperado 1 botão, encontrados {len(hits)}')
                  match = hits[0]
                  attrs, body = match.group('attrs'), match.group('body')
                  class_match = re.search(r'class="([^"]*)"', attrs)
                  classes = class_match.group(1).split() if class_match else []
                  classes = [c for c in classes if c != old_class]
                  if 'action-button' not in classes:
                      classes.insert(0, 'action-button')
                  class_attr = f'class="{" ".join(classes)}"'
                  attrs = re.sub(r'class="[^"]*"', class_attr, attrs, count=1) if class_match else f' {class_attr}' + attrs
                  additions = [('data-component', 'action-button'), ('data-variant', variant)]
                  if size:
                      additions.append(('data-size', size))
                  if icon_only:
                      additions.append(('data-icon-only', 'true'))
                  for key, value in additions:
                      if f'{key}=' not in attrs:
                          attrs += f' {key}="{value}"'
                  if 'material-symbols-outlined' in body and 'action-button__icon' not in body:
                      body = body.replace('class="material-symbols-outlined"', 'class="material-symbols-outlined action-button__icon" aria-hidden="true"', 1)
                  text = text[:match.start()] + f'<button{attrs}>{body}</button>' + text[match.end():]
              Path(path).write_text(text, encoding='utf-8')

          migrate('index.html', [
              ('data-action="open-create-note"', 'add Novo manuscrito', 'create-button', 'primary', None, False),
              ('data-action="open-active-manuscript"', 'edit_note Abrir no editor', 'primary-button', 'primary', None, False),
              ('data-export-format="txt"', 'article Texto', 'ghost-button', 'ghost', 'compact', False),
              ('data-export-format="md"', 'markdown Markdown', 'ghost-button', 'ghost', 'compact', False),
              ('data-export-format="html"', 'html HTML', 'ghost-button', 'ghost', 'compact', False),
              ('data-export-format="docx"', 'description Word', 'ghost-button', 'ghost', 'compact', False),
              ('data-export-format="epub"', 'auto_stories ePub · KDP', 'ghost-button', 'ghost', 'compact', False),
              ('data-export-format="obsidian"', 'hub Obsidian', 'ghost-button', 'ghost', 'compact', False),
              ('data-action="export-backup"', 'file_save Guardar cópia do acervo', 'secondary-button', 'secondary', None, False),
              ('data-action="export-backup"', 'file_save Guardar cópia', 'secondary-button', 'secondary', None, False),
              ('data-action="export-rtf"', 'file_download Exportar .rtf', 'secondary-button', 'secondary', None, False),
              ('data-action="export-acervo"', 'file_download Exportar textos', 'secondary-button', 'secondary', None, False),
              ('data-action="export-obsidian-vault"', 'hub Exportar para Obsidian', 'secondary-button', 'secondary', None, False),
              ('data-action="close-create-note"', 'close', 'icon-button', 'ghost', 'compact', True),
          ])
          migrate('app.js', [
              ('data-action="create-step-back"', 'arrow_back voltar', 'create-tpl-back', 'ghost', 'compact', False),
          ])
          migrate('archive-controller.js', [
              ('data-action="export-backup"', 'file_save Exportar cópia de segurança', 'secondary-button', 'secondary', None, False),
              ('data-action="cancel-master-reset"', 'Cancelar', 'secondary-button', 'secondary', None, False),
          ])

          Path('index.html').write_text(Path('index.html').read_text(encoding='utf-8').replace(OLD, NEW), encoding='utf-8')
          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          if sw.count('const CACHE_NAME = "vereda-offline-v964";') != 1:
              raise SystemExit('cache v964 não encontrado de forma única')
          sw_path.write_text(sw.replace('const CACHE_NAME = "vereda-offline-v964";', 'const CACHE_NAME = "vereda-offline-v965";').replace(OLD, NEW), encoding='utf-8')
          for name in ('ui-dialog.js', 'css/14-archive-inspector.css', 'css/wood-icons.css'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if OLD not in text:
                  raise SystemExit(f'{name}: versão antiga ausente')
              path.write_text(text.replace(OLD, NEW), encoding='utf-8')

          index = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          archive = Path('archive-controller.js').read_text(encoding='utf-8')
          assert 'class="secondary-button" data-action="import-backup"' in index
          assert 'class="danger-button" data-action="master-reset"' in index
          assert 'class="create-tpl-free" data-action="create-quick-note"' in app
          assert 'class="danger-button" data-action="confirm-master-reset"' in archive

      - name: Validar sintaxe e distribuição
        run: |
          node --check app.js
          node --check archive-controller.js
          node --check ui-dialog.js
          python3 scripts/auditor-asset-version.py

      - name: Publicar arquivos aprovados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js archive-controller.js service-worker.js ui-dialog.js css/14-archive-inspector.css css/wood-icons.css
          git commit -m "Migra ações de baixo risco do Acervo para ActionButton"
          git push origin HEAD:agent/archive-actionbutton-low-risk
