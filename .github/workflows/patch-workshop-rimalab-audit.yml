name: Ajuste RimaLab — Clareza Oficina

on:
  push:
    branches:
      - clarity/desktop-workshop-authorship
    paths:
      - scripts/patch-workshop-rimalab-audit.py
      - .github/workflows/patch-workshop-rimalab-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: clarity/desktop-workshop-authorship
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Aplicar patch
        run: python3 scripts/patch-workshop-rimalab-audit.py
      - name: Validar
        run: |
          python -m py_compile scripts/auditor-product-clarity-workshop.py
          node --check workshop-authorship-clarity-controller.js
          python3 scripts/auditor-asset-version.py
        env:
          GITHUB_BASE_REF: main
      - name: Registrar e limpar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js scripts/auditor-product-clarity-workshop.py
          git rm scripts/patch-workshop-rimalab-audit.py .github/workflows/patch-workshop-rimalab-audit.yml
          git commit -m "fix(clarity): protect RimaLab inside desktop workbench"
          git push origin HEAD:clarity/desktop-workshop-authorship
