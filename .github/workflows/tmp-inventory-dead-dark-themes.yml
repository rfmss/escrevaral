name: Operação temporária — remover temas escuros mortos

on:
  push:
    branches:
      - agent/remove-temas-escuros-mortos

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Instalar parser CSS temporário
        run: npm install --prefix /tmp/dead-theme-tools postcss@8.4.49

      - name: Remover apenas regras e seletores mortos
        run: |
          node <<'JS'
          const fs = require('fs');
          const postcss = require('/tmp/dead-theme-tools/node_modules/postcss');

          const files = [
            'css/00-tokens.css',
            'css/02-shell-navigation.css',
            'css/03-editor-modes.css',
            'css/03-editor-toolbar.css',
            'css/03-inspector-precision.css',
            'css/06-academy-tools.css',
          ];
          const variants = ['cerrado-dark', 'mata-dark', 'amazonia-dark'];
          const expected = {
            'css/00-tokens.css': [42, 42, 42],
            'css/02-shell-navigation.css': [19, 19, 18],
            'css/03-editor-modes.css': [5, 5, 5],
            'css/03-editor-toolbar.css': [14, 14, 14],
            'css/03-inspector-precision.css': [14, 14, 14],
            'css/06-academy-tools.css': [1, 1, 1],
          };
          const deadAttribute = /\[data-theme\s*=\s*(["'])(?:cerrado-dark|mata-dark|amazonia-dark)\1\]/;
          const deadNot = /:not\(\[data-theme\s*=\s*(["'])(?:cerrado-dark|mata-dark|amazonia-dark)\1\]\)/g;
          const staleComment = /(?:temas? escuros|dark themes|cerrado-dark|mata-dark|amazonia-dark)/i;

          let totalBefore = 0;
          let totalAfter = 0;

          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const counts = variants.map(variant => before.split(variant).length - 1);
            if (JSON.stringify(counts) !== JSON.stringify(expected[file])) {
              throw new Error(`${file}: contagem inesperada ${JSON.stringify(counts)}; esperado ${JSON.stringify(expected[file])}`);
            }
            totalBefore += counts.reduce((sum, count) => sum + count, 0);

            const root = postcss.parse(before, { from: file });
            let changedRules = 0;
            let removedRules = 0;

            root.walkRules(rule => {
              if (!variants.some(variant => rule.selector.includes(variant))) return;

              const original = rule.selector;
              const kept = [];

              for (const selector of rule.selectors) {
                const cleaned = selector.replace(deadNot, '');
                if (deadAttribute.test(cleaned)) continue;
                kept.push(cleaned);
              }

              if (kept.length === 0) {
                const previous = rule.prev();
                rule.remove();
                removedRules += 1;
                if (previous && previous.type === 'comment' && staleComment.test(previous.text)) {
                  previous.remove();
                }
                return;
              }

              const changed = kept.length !== rule.selectors.length || kept.some((selector, index) => selector !== rule.selectors[index]);
              if (!changed) return;

              const indentMatch = original.match(/,\n([ \t]*)/);
              const separator = original.includes('\n') ? `,\n${indentMatch ? indentMatch[1] : ''}` : ', ';
              rule.selector = kept.join(separator);
              changedRules += 1;
            });

            const after = root.toString();
            postcss.parse(after, { from: file });

            const remaining = variants.map(variant => after.split(variant).length - 1);
            totalAfter += remaining.reduce((sum, count) => sum + count, 0);
            if (remaining.some(Boolean)) {
              throw new Error(`${file}: ocorrências remanescentes ${JSON.stringify(remaining)}`);
            }

            fs.writeFileSync(file, after, 'utf8');
            console.log(`${file}: regras ajustadas=${changedRules}, regras removidas=${removedRules}, ocorrências removidas=${counts.reduce((sum, count) => sum + count, 0)}`);
          }

          if (totalBefore !== 284) throw new Error(`total inicial inesperado: ${totalBefore}`);
          if (totalAfter !== 0) throw new Error(`total final inesperado: ${totalAfter}`);
          console.log(`total removido=${totalBefore}; total final=${totalAfter}`);
          JS

      - name: Atualizar identificadores de distribuição
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_version = "20260726-lexical-hint-v1"
          new_version = "20260726-remove-dead-dark-themes-v1"

          def replace(path, old, new, *, expected=None, minimum=None):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{path}: esperado {expected}; encontrado {count} para {old!r}")
              if minimum is not None and count < minimum:
                  raise SystemExit(f"{path}: esperado ao menos {minimum}; encontrado {count} para {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")
              print(f"{path}: {count} substituição(ões)")

          replace("index.html", old_version, new_version, minimum=60)
          replace("service-worker.js", old_version, new_version, minimum=2)
          replace("ui-dialog.js", old_version, new_version, expected=1)
          replace(
              "service-worker.js",
              'const CACHE_NAME = "vereda-offline-v959";',
              'const CACHE_NAME = "vereda-offline-v960";',
              expected=1,
          )
          PY

      - name: Validar transformação
        run: |
          if grep -R -n -E 'cerrado-dark|mata-dark|amazonia-dark' \
            css/00-tokens.css \
            css/02-shell-navigation.css \
            css/03-editor-modes.css \
            css/03-editor-toolbar.css \
            css/03-inspector-precision.css \
            css/06-academy-tools.css; then
            echo "Ainda existem seletores mortos nos CSS de produção."
            exit 1
          fi
          python3 scripts/auditor-asset-version.py
          git diff --check
          git diff --exit-code origin/main -- docs/_decisoes/SUGESTOES_AUTONOMAS_2026-06-16.md

      - name: Registrar limpeza na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            css/00-tokens.css \
            css/02-shell-navigation.css \
            css/03-editor-modes.css \
            css/03-editor-toolbar.css \
            css/03-inspector-precision.css \
            css/06-academy-tools.css \
            index.html \
            service-worker.js \
            ui-dialog.js
          git commit -m "Remove temas escuros mortos"
          git push origin "HEAD:${GITHUB_REF_NAME}"
