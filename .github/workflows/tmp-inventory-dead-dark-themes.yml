name: Operação temporária — inventariar temas escuros mortos

on:
  push:
    branches:
      - agent/remove-temas-escuros-mortos

permissions:
  contents: write

jobs:
  inventariar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2

      - name: Contar ocorrências em CSS
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          tokens = ("cerrado-dark", "mata-dark", "amazonia-dark")
          files = {}
          totals = {token: 0 for token in tokens}

          for path in sorted(Path("css").rglob("*.css")):
              text = path.read_text(encoding="utf-8")
              counts = {token: text.count(token) for token in tokens}
              if any(counts.values()):
                  files[path.as_posix()] = counts
                  for token, count in counts.items():
                      totals[token] += count

          result = {
              "files": files,
              "totals_by_variant": totals,
              "total_occurrences": sum(totals.values()),
              "file_count": len(files),
          }

          if len(files) != 6:
              raise SystemExit(f"esperados 6 arquivos CSS; encontrados {len(files)}: {sorted(files)}")

          Path("_tmp_dead_dark_inventory.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Registrar inventário temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmp_dead_dark_inventory.json
          git commit -m "Registra inventário temporário dos temas escuros mortos"
          git push origin "HEAD:${GITHUB_REF_NAME}"
