name: Operação temporária — classificar temas escuros mortos

on:
  push:
    branches:
      - agent/remove-temas-escuros-mortos

permissions:
  contents: write

jobs:
  classificar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2

      - name: Classificar grupos de seletores
        run: |
          python3 - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          tokens = ("cerrado-dark", "mata-dark", "amazonia-dark")
          result = {}

          for path in sorted(Path("css").rglob("*.css")):
              text = path.read_text(encoding="utf-8")
              if not any(token in text for token in tokens):
                  continue

              preludes = Counter()
              for match in re.finditer(r"([^{}]+)\{", text):
                  prelude = match.group(1).strip()
                  if any(token in prelude for token in tokens):
                      normalized = " ".join(prelude.split())
                      preludes[normalized] += 1

              result[path.as_posix()] = [
                  {"prelude": prelude, "count": count}
                  for prelude, count in sorted(preludes.items())
              ]

          Path("_tmp_dead_dark_context.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Registrar classificação temporária
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmp_dead_dark_context.json
          git commit -m "Classifica seletores temporários dos temas escuros mortos"
          git push origin "HEAD:${GITHUB_REF_NAME}"
