name: Migração de versão — Clareza do Acervo

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/migrate-clarity-archive-version.py"
      - ".github/workflows/migrate-clarity-archive-version.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-clarity-archive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          ref: clarity/desktop-archive
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Sincronizar versão global
        run: python scripts/migrate-clarity-archive-version.py

      - name: Validar distribuição
        run: python scripts/auditor-asset-version.py
        env:
          GITHUB_BASE_REF: main

      - name: Registrar migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css service-worker.js ui-dialog.js product-clarity-controller.js oficina-navigation-controller.js
          if git diff --cached --quiet; then
            echo "Distribuição já sincronizada."
            exit 0
          fi
          git commit -m "build(clarity): sincronize versão global do Acervo"
          git push origin HEAD:clarity/desktop-archive
