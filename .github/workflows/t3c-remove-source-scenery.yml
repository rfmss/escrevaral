name: T3c Remove Source Scenery

on:
  push:
    branches: [feat/escrevaral-paper-home]
    paths:
      - ".github/workflows/t3c-remove-source-scenery.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: feat/escrevaral-paper-home
          fetch-depth: 0

      - name: Corrigir cenografia na fonte React
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('mass-notes-next/src/App.tsx')
          source = path.read_text()
          before = source

          source = source.replace(
              '<button type="button">Escrita <span className="chevron" aria-hidden="true" /></button>',
              '<button type="button" disabled aria-disabled="true" aria-label="Modo atual: Escrita">Escrita</button>',
              1,
          )

          source, count = re.subn(
              r'<button type="button" onClick=\{\(\) => setRailOpen\(true\)\}>(?=<svg className="ui-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 5\.5h17v22H8z)',
              '<button type="button" disabled aria-disabled="true" aria-label="Notas — ainda não disponível">',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('botão Notas não foi encontrado exatamente uma vez')

          source, count = re.subn(
              r'\n          <section className="research">.*?\n          </section>',
              '',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('seção fictícia de pesquisa não removida')

          source, count = re.subn(
              r'\n          <section className="quick-box">.*?</section>',
              '',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Caixa rápida cenográfica não removida')

          source, count = re.subn(
              r'\n          <section className="distribution-section">.*?</section>',
              '',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('distribuição fictícia não removida')

          source = source.replace(
              "{(draft.tags.length ? draft.tags : ['mistério', 'retorno', 'cidade', 'passado', 'segredos']).slice(0, 5).map((tag) => <button type=\"button\" key={tag}># {tag}</button>)}",
              "{draft.tags.slice(0, 5).map((tag) => <button type=\"button\" key={tag}># {tag}</button>)}",
              1,
          )

          old_versions = '<section className="versions"><div className="section-title"><h3 className="blue">VERSÕES</h3><a href="#" onClick={(event) => event.preventDefault()}>Ver todas</a></div><div className="version"><b>v{Math.max(1, draft.revision + 1)}.0</b><time>{formatDateTime(draft.updatedAt)}</time><em>Atual</em></div><div className="version"><b>local</b><time>IndexedDB</time></div></section>'
          new_versions = '<section className="versions" aria-label="Estado local do documento"><div className="section-title"><h3 className="blue">ESTADO LOCAL</h3></div><div className="version"><b>rev. {Math.max(1, draft.revision + 1)}</b><time>{formatDateTime(draft.updatedAt)}</time><em>Atual</em></div><div className="version"><b>local</b><time>IndexedDB</time></div></section>'
          if old_versions not in source:
              raise SystemExit('versões cenográficas não encontradas')
          source = source.replace(old_versions, new_versions, 1)

          old_focus = '<div className="focus"><span className="eyebrow">FOCO</span><strong>60 min</strong><button className="play" type="button" onClick={() => setFocusMode((value) => !value)}>{focusMode ? \'Ⅱ\' : \'▶\'}</button></div>'
          new_focus = '<div className="focus"><span className="eyebrow">FOCO</span><strong>{focusMode ? \'Ativo\' : \'Pronto\'}</strong><button className="play" type="button" aria-pressed={focusMode} onClick={() => setFocusMode((value) => !value)}>{focusMode ? \'Ⅱ\' : \'▶\'}</button></div>'
          if old_focus not in source:
              raise SystemExit('FOCO 60 min não encontrado')
          source = source.replace(old_focus, new_focus, 1)

          old_language = '<div className="language"><span>IDIOMA<strong>Português (BR)</strong></span><button type="button" aria-label="Selecionar idioma"><span className="chevron" aria-hidden="true" /></button></div>'
          new_language = '<div className="language"><span>IDIOMA<strong>Português (BR)</strong></span></div>'
          if old_language not in source:
              raise SystemExit('seletor de idioma cenográfico não encontrado')
          source = source.replace(old_language, new_language, 1)

          forbidden = [
              'Personagens <b>9</b>',
              'Locações <b>14</b>',
              'Referências <b>23</b>',
              'Inspiração <b>7</b>',
              'Lixeira <b>3</b>',
              'CAIXA RÁPIDA',
              "width: '18%'",
              "width: '41%'",
              "['mistério', 'retorno', 'cidade', 'passado', 'segredos']",
              '>Ver todas<',
              '<strong>60 min</strong>',
              'aria-label="Selecionar idioma"',
          ]
          leftovers = [item for item in forbidden if item in source]
          if leftovers:
              raise SystemExit(f'cenografia ainda presente: {leftovers}')
          if source == before:
              raise SystemExit('App.tsx não foi alterado')

          path.write_text(source)
          PY

      - name: Commitar poda e remover bootstrap
        run: |
          git rm .github/workflows/t3c-remove-source-scenery.yml
          git add mass-notes-next/src/App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: retirar cenografia morta da Paper Home"
          git push origin HEAD:feat/escrevaral-paper-home
