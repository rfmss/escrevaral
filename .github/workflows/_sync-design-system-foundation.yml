name: Sincronização transitória da fundação do Design System

on:
  push:
    branches:
      - agent/design-system-components-foundation
    paths:
      - "scripts/_sincronizar-fundacao-design-system.py"
      - ".github/workflows/_sync-design-system-foundation.yml"

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          ref: agent/design-system-components-foundation
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Aplicar substituições exatas
        run: python scripts/_sincronizar-fundacao-design-system.py

      - name: Registrar sincronização e remover rotina transitória
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sincroniza versão da fundação do Design System"
          git push origin HEAD:agent/design-system-components-foundation
