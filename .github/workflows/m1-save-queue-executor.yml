name: Executor efêmero — fila de salvamento

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/m1-save-queue-executor.yml

permissions:
  contents: write

concurrency:
  group: m1-save-queue-executor
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar a branch experimental
        uses: actions/checkout@v4
        with:
          ref: experiment/mass-notes-tiptap
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar patch auditável
        run: python3 mass-notes-next/scripts/apply-save-queue-patch.py

      - name: Instalar dependências
        working-directory: mass-notes-next
        run: npm ci --no-audit --no-fund

      - name: Compilar o harness das regressões
        working-directory: mass-notes-next
        run: npx tsc -b && npx vite build

      - name: Instalar navegadores
        working-directory: mass-notes-next
        run: npx playwright install --with-deps chromium firefox

      - name: Executar regressões da fila e dos conflitos
        working-directory: mass-notes-next
        run: >-
          npx playwright test
          tests/m1-save-queue.spec.ts
          tests/m0-9-integrated.spec.ts
          tests/gate7-review-decorations.spec.ts
          --grep "fila de salvamento|conflito misto|trocar de documento"

      - name: Criar commit atômico e remover o executor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m1-save-queue-executor.yml \
            mass-notes-next/scripts/apply-save-queue-patch.py
          git add mass-notes-next/src/App.tsx \
            mass-notes-next/tests/m0-9-integrated.spec.ts \
            mass-notes-next/tests/m1-save-queue.spec.ts
          git diff --cached --check
          git commit -m "fix(storage): serializa salvamentos locais"
          git push origin HEAD:experiment/mass-notes-tiptap

# O harness ignora apenas o prebuild da Anatomia; o workflow oficial executa o build integral.
