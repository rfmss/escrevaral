name: Corrigir auditor da faixa

on:
  push:
    branches:
      - fix/faixa-situacao-mobile
    paths:
      - ".github/workflows/fix-faixa-auditor-once.yml"

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          ref: fix/faixa-situacao-mobile
          fetch-depth: 0

      - name: Escapar quebras no JavaScript embutido
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/auditor-faixa-situacao-mobile.py')
          text = path.read_text(encoding='utf-8')
          old = "'\\n\\n'"
          new = "'\\\\n\\\\n'"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Esperava 2 ocorrências; encontrei {count}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/fix-faixa-auditor-once.yml').unlink()
          PY
          python3 -m py_compile scripts/auditor-faixa-situacao-mobile.py
          grep -F "join('\\\\n\\\\n')" scripts/auditor-faixa-situacao-mobile.py
          grep -F "split('\\\\n\\\\n')" scripts/auditor-faixa-situacao-mobile.py

      - name: Gravar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/auditor-faixa-situacao-mobile.py .github/workflows/fix-faixa-auditor-once.yml
          git commit -m "test: escapar massa textual da faixa móvel"
          git push origin HEAD:fix/faixa-situacao-mobile
