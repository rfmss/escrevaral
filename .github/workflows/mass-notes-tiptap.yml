name: Mass Notes Tiptap

on:
  pull_request:
    branches: [main]
    paths:
      - "mass-notes-next/**"
      - ".github/workflows/mass-notes-tiptap.yml"
      - ".github/workflows/m1-e2-algures-outrora-executor.yml"
      - "index.html"
      - "service-worker.js"
      - "lexical-engine.js"

permissions:
  contents: write

concurrency:
  group: m1-e2-algures-outrora-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  consolidar:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/mass-notes-tiptap'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout da cabeça experimental
        uses: actions/checkout@v4.2.2
        with:
          ref: experiment/mass-notes-tiptap
          fetch-depth: 0

      - name: Confirmar fronteira efêmera
        shell: bash
        run: |
          set -euo pipefail
          test -f mass-notes-next/scripts/apply-algures-outrora-tranche.py
          test -f .github/workflows/m1-e2-algures-outrora-executor.yml
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Python para preparar a Anatomia
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar runtime fiel e leve da Anatomia
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build-anatomia-runtime.py
          test "$(wc -c < mass-notes-next/public/anatomia-do-livro.html)" -gt 50000
          test "$(wc -c < mass-notes-next/public/anatomia-do-livro.html)" -lt 500000

      - name: Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mass-notes-next/package-lock.json

      - name: Aplicar consolidação editorial mínima
        run: python3 mass-notes-next/scripts/apply-algures-outrora-tranche.py

      - name: Instalar dependências reproduzíveis
        working-directory: mass-notes-next
        run: npm ci --no-audit --no-fund

      - name: Regenerar e verificar auditorias
        working-directory: mass-notes-next
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:lexicon
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('e2-definition-duplicates.json').read_text(encoding='utf-8'))
          expected = {
              'rawDeclarations': 1008,
              'effectiveKeys': 936,
              'duplicateGroups': 66,
              'overwrittenDeclarations': 72,
              'identicalGroups': 0,
              'normalizedEquivalentGroups': 0,
              'conflictingGroups': 66,
          }
          if report['counts'] != expected:
              raise SystemExit(f'Contagens inesperadas: {report["counts"]}')
          keys = {group['key'] for group in report['duplicateGroups']}
          if {'algures', 'outrora'} & keys:
              raise SystemExit('Os verbetes consolidados ainda aparecem como duplicados')
          PY

      - name: Compilar aplicação
        working-directory: mass-notes-next
        run: npm run build

      - name: Instalar Chromium e Firefox
        working-directory: mass-notes-next
        run: npx playwright install --with-deps chromium firefox

      - name: Executar contratos dos dois verbetes
        working-directory: mass-notes-next
        run: npx playwright test tests/m1-e2-algures-outrora-source.spec.ts tests/m1-e2-algures-outrora-regression.spec.ts --project=chromium --project=firefox

      - name: Fechar registro, restaurar workflow e validar fronteira
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('mass-notes-next/docs/logs/2026-08-01-m1-e2-algures-outrora.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('__RUN_ID__', os.environ['GITHUB_RUN_ID'])
          text = text.replace('__TARGETED_RESULT__', '8/8')
          path.write_text(text, encoding='utf-8')
          PY

          git show HEAD^:.github/workflows/mass-notes-tiptap.yml > .github/workflows/mass-notes-tiptap.yml
          git rm .github/workflows/m1-e2-algures-outrora-executor.yml
          git rm mass-notes-next/scripts/apply-algures-outrora-tranche.py
          git diff --check

          python3 - <<'PY'
          import subprocess

          allowed = {
              '.github/workflows/mass-notes-tiptap.yml',
              '.github/workflows/m1-e2-algures-outrora-executor.yml',
              'index.html',
              'lexical-engine.js',
              'service-worker.js',
              'mass-notes-next/e2-definition-duplicates.json',
              'mass-notes-next/e2-definition-duplicates.md',
              'mass-notes-next/scripts/apply-algures-outrora-tranche.py',
              'mass-notes-next/tests/m1-e2-algures-outrora-source.spec.ts',
              'mass-notes-next/tests/m1-e2-algures-outrora-regression.spec.ts',
              'mass-notes-next/docs/logs/2026-08-01-m1-e2-algures-outrora.md',
              'mass-notes-next/public/anatomia-do-livro.html',
              'mass-notes-next/public/assets/anatomia/anatomia-asset-1.webp',
              'mass-notes-next/public/assets/anatomia/anatomia-asset-2.webp',
          }
          lines = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          paths = {line[3:] for line in lines}
          unexpected = paths - allowed
          required = {
              '.github/workflows/mass-notes-tiptap.yml',
              '.github/workflows/m1-e2-algures-outrora-executor.yml',
              'index.html',
              'lexical-engine.js',
              'service-worker.js',
              'mass-notes-next/e2-definition-duplicates.json',
              'mass-notes-next/e2-definition-duplicates.md',
              'mass-notes-next/scripts/apply-algures-outrora-tranche.py',
              'mass-notes-next/tests/m1-e2-algures-outrora-source.spec.ts',
              'mass-notes-next/tests/m1-e2-algures-outrora-regression.spec.ts',
              'mass-notes-next/docs/logs/2026-08-01-m1-e2-algures-outrora.md',
          }
          missing = required - paths
          if unexpected or missing:
              raise SystemExit(
                  f'Fronteira inválida; inesperados={sorted(unexpected)} ausentes={sorted(missing)}'
              )
          PY

      - name: Commitar tranche atômica
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(lexico): consolidar algures e outrora"
          git push origin HEAD:experiment/mass-notes-tiptap
