name: Mass Notes Tiptap

on:
  push:
    branches:
      - experiment/mass-notes-tiptap
    paths:
      - "mass-notes-next/**"
      - ".github/workflows/mass-notes-tiptap.yml"
      - "anatomia-do-livro.html"
      - "analise-engine.js"
      - "syntax-engine.js"
      - "punctuation-engine.js"
      - "voice-engine.js"
      - "decolonial-engine.js"
      - "decolonial-data.json"
      - "rimalab-engine.js"
      - "rimalab-data.json"
      - "js/data/criterios-data.js"
  pull_request:
    branches:
      - main
    paths:
      - "mass-notes-next/**"
      - ".github/workflows/mass-notes-tiptap.yml"
      - "anatomia-do-livro.html"
      - "analise-engine.js"
      - "syntax-engine.js"
      - "punctuation-engine.js"
      - "voice-engine.js"
      - "decolonial-engine.js"
      - "decolonial-data.json"
      - "rimalab-engine.js"
      - "rimalab-data.json"
      - "js/data/criterios-data.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mass-notes-tiptap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mass-notes-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mass-notes-next/package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci --no-audit --no-fund

      - name: Compilar aplicação
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee build.log
          cmp --silent public/anatomia-do-livro.html dist/anatomia-do-livro.html
          test "$(wc -c < dist/anatomia-do-livro.html)" -eq 208728
          test "$(sha256sum dist/anatomia-do-livro.html | cut -d' ' -f1)" = "d618b69aeab6551c5b0815024c8a9b7ec545ffe970776084be5e86b06a344fd8"
          grep --quiet 'StPageFlip 2.0.7' dist/anatomia-do-livro.html
          grep --quiet 'Anatomia do Livro — Escrevaral' dist/anatomia-do-livro.html
          grep --quiet -- '--sky:#a9d4e4' dist/anatomia-do-livro.html
          ! grep --quiet -- '--paper:#f1e7d4' dist/anatomia-do-livro.html
          cmp --silent public/assets/blueprint/anatomia-livro-render.webp dist/assets/blueprint/anatomia-livro-render.webp
          node --input-type=module -e "import { createHash } from 'node:crypto'; import { readFileSync } from 'node:fs'; const b=readFileSync('dist/assets/blueprint/anatomia-livro-render.webp'); const sha=createHash('sha256').update(b).digest('hex'); if(b.subarray(0,4).toString('ascii')!=='RIFF'||b.subarray(8,12).toString('ascii')!=='WEBP'||b.length!==43462||sha!=='9c1fd7429b09df2087f2ac38f0ddf097ed32719ac5dde02877303eaa0c25a028') process.exit(1)"
          sha256sum dist/anatomia-do-livro.html > anatomy-sha256.txt
          sha256sum dist/assets/blueprint/anatomia-livro-render.webp > blueprint-sha256.txt

      - name: Instalar Chromium e Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Testar fundação nos navegadores
        run: npm run test:e2e

      - name: Publicar preview estática isolada
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "preview: ${GITHUB_SHA}"
          git branch -M preview-build
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/preview-mass-notes-tiptap

      - name: Renovar cache da preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: |
          base="https://raw.githack.com/${GITHUB_REPOSITORY}/preview-mass-notes-tiptap"
          for path in index.html assets/index.js assets/index.css anatomia-do-livro.html assets/blueprint/anatomia-livro-render.webp; do
            curl --silent --show-error --request DELETE "https://raw.githack.com/purge?url=${base}/${path}" || true
          done

      - name: Verificar preview pública
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        run: |
          set -euo pipefail
          base="https://raw.githack.com/${GITHUB_REPOSITORY}/preview-mass-notes-tiptap"
          for attempt in $(seq 1 18); do
            rm -f /tmp/mass-notes-index.html /tmp/mass-notes-app.js /tmp/mass-notes-app.css /tmp/mass-notes-anatomia.html /tmp/mass-notes-blueprint.webp
            if curl --fail --silent --show-error --location "${base}/index.html" -o /tmp/mass-notes-index.html \
              && grep --quiet './assets/index.js' /tmp/mass-notes-index.html \
              && grep --quiet './assets/index.css' /tmp/mass-notes-index.html \
              && curl --fail --silent --show-error --location "${base}/assets/index.js" -o /tmp/mass-notes-app.js \
              && curl --fail --silent --show-error --location "${base}/assets/index.css" -o /tmp/mass-notes-app.css \
              && curl --fail --silent --show-error --location "${base}/anatomia-do-livro.html" -o /tmp/mass-notes-anatomia.html \
              && curl --fail --silent --show-error --location "${base}/assets/blueprint/anatomia-livro-render.webp" -o /tmp/mass-notes-blueprint.webp \
              && test "$(wc -c < /tmp/mass-notes-app.js)" -gt 1000 \
              && test "$(wc -c < /tmp/mass-notes-app.css)" -gt 1000 \
              && test "$(wc -c < /tmp/mass-notes-anatomia.html)" -eq 208728 \
              && test "$(sha256sum /tmp/mass-notes-anatomia.html | cut -d' ' -f1)" = "d618b69aeab6551c5b0815024c8a9b7ec545ffe970776084be5e86b06a344fd8" \
              && grep --quiet 'StPageFlip 2.0.7' /tmp/mass-notes-anatomia.html \
              && grep --quiet -- '--sky:#a9d4e4' /tmp/mass-notes-anatomia.html \
              && ! grep --quiet -- '--paper:#f1e7d4' /tmp/mass-notes-anatomia.html \
              && test "$(wc -c < /tmp/mass-notes-blueprint.webp)" -eq 43462 \
              && test "$(head -c 4 /tmp/mass-notes-blueprint.webp)" = "RIFF" \
              && test "$(dd if=/tmp/mass-notes-blueprint.webp bs=1 skip=8 count=4 2>/dev/null)" = "WEBP" \
              && test "$(sha256sum /tmp/mass-notes-blueprint.webp | cut -d' ' -f1)" = "9c1fd7429b09df2087f2ac38f0ddf097ed32719ac5dde02877303eaa0c25a028"; then
              echo "Preview pública respondeu com a Anatomia azul correta e a prancha WebP coerente."
              exit 0
            fi
            echo "Preview ainda não convergiu no CDN (tentativa ${attempt}/18)."
            sleep 10
          done
          echo "A preview pública não entregou o conjunto correto após 3 minutos."
          exit 1

      - name: Guardar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-notes-tiptap-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            mass-notes-next/build.log
            mass-notes-next/anatomy-sha256.txt
            mass-notes-next/blueprint-sha256.txt
            mass-notes-next/public/anatomia-do-livro.html
            mass-notes-next/public/assets/blueprint/anatomia-livro-render.webp
            mass-notes-next/package-lock.json
            mass-notes-next/playwright-report/**
            mass-notes-next/test-results/**
