name: Mass Notes Tiptap

on:
  push:
    branches:
      - experiment/mass-notes-tiptap
    paths:
      - "mass-notes-next/**"
      - ".github/workflows/mass-notes-tiptap.yml"
      - "analise-engine.js"
      - "syntax-engine.js"
      - "punctuation-engine.js"
      - "voice-engine.js"
      - "decolonial-engine.js"
      - "decolonial-data.json"
      - "rimalab-engine.js"
      - "rimalab-data.json"
      - "js/data/criterios-data.js"
  pull_request:
    branches:
      - main
    paths:
      - "mass-notes-next/**"
      - ".github/workflows/mass-notes-tiptap.yml"
      - "analise-engine.js"
      - "syntax-engine.js"
      - "punctuation-engine.js"
      - "voice-engine.js"
      - "decolonial-engine.js"
      - "decolonial-data.json"
      - "rimalab-engine.js"
      - "rimalab-data.json"
      - "js/data/criterios-data.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mass-notes-tiptap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mass-notes-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Compilar aplicação
        run: npm run build

      - name: Instalar Chromium e Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Testar fundação nos navegadores
        run: npm run test:e2e

      - name: Publicar preview estática isolada
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "preview: ${GITHUB_SHA}"
          git branch -M preview-build
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/preview-mass-notes-tiptap

      - name: Guardar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-notes-tiptap-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            mass-notes-next/playwright-report/**
            mass-notes-next/test-results/**
