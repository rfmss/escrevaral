name: Correção temporária do aplicador sintático

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/syntax-token-palette'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: agent/syntax-token-palette
          fetch-depth: 0

      - name: Corrigir e auto-remover
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-syntax-token-palette.yml')
          text = workflow.read_text(encoding='utf-8')
          old = 'if precision_css.count(selector_start) != 1 or precision_css.count(tooltip_start) != 1:'
          new = 'if selector_start not in precision_css or precision_css.count(tooltip_start) != 1:'
          if text.count(old) != 1:
              raise SystemExit('Pré-condição esperada não encontrada de forma única')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/tmp-fix-syntax-runner.yml').unlink()
          placeholder = Path('docs/_tmp_placeholder')
          if placeholder.exists():
              placeholder.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-syntax-token-palette.yml .github/workflows/tmp-fix-syntax-runner.yml docs/_tmp_placeholder
          git commit -m "Corrige aplicador temporário da paleta sintática"
          git push origin HEAD:agent/syntax-token-palette
