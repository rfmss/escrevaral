name: Verificar migração baixa do Ateliê

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/atelier-actionbutton-low-risk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar escopo e contrato
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          checks = {
              'Limpar busca ghost compact icon-only': 'data-rights-search-clear aria-label="Limpar busca" hidden data-component="action-button" data-variant="ghost" data-size="compact" data-icon-only="true"',
              'Ver cuidados secondary': 'data-action="scroll-rights" data-component="action-button" data-variant="secondary"',
              'Anatomia preserva âncora': 'href="./anatomia-do-livro.html" target="_blank" class="action-button academy-anatomy-btn" data-component="action-button" data-variant="secondary"',
          }
          for label, needle in checks.items():
              if index.count(needle) != 1:
                  raise SystemExit(f'{label}: contrato ausente ou duplicado')

          if '<button' in index[index.find('Abrir Anatomia do Livro')-300:index.find('Abrir Anatomia do Livro')]:
              pass
          anchor_start = index.rfind('<a ', 0, index.find('Abrir Anatomia do Livro'))
          anchor_end = index.find('</a>', index.find('Abrir Anatomia do Livro'))
          if anchor_start < 0 or anchor_end < 0:
              raise SystemExit('Abrir Anatomia do Livro deixou de ser âncora')

          expected_version = '20260727-atelier-actionbutton-low-risk-v1'
          for filename in ['index.html', 'service-worker.js', 'ui-dialog.js', 'css/14-archive-inspector.css', 'css/wood-icons.css']:
              text = Path(filename).read_text(encoding='utf-8')
              if expected_version not in text:
                  raise SystemExit(f'Versão nova ausente em {filename}')
              if '20260727-master-reset-hidden-v1' in text:
                  raise SystemExit(f'Versão antiga presente em {filename}')

          sw = Path('service-worker.js').read_text(encoding='utf-8')
          if 'const CACHE_NAME = "vereda-offline-v967";' not in sw:
              raise SystemExit('Cache v967 ausente')
          PY

          git diff --check origin/main...HEAD
