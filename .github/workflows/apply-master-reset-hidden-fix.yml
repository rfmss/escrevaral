name: Aplicar correção mínima do modal de zerar

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-master-reset-hidden-fix.yml"

permissions:
  contents: write

jobs:
  aplicar-e-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter branch do PR
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Aplicar patch aprovado
        shell: python
        run: |
          from pathlib import Path

          old_asset = "20260726-archive-actionbutton-low-risk-v1"
          new_asset = "20260727-master-reset-hidden-v1"

          css_path = Path("css/02-shell-navigation.css")
          css = css_path.read_text(encoding="utf-8")
          anchor = """#master-reset-modal {\n  position: fixed;\n  inset: 0;\n  z-index: 200;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 24px;\n}\n"""
          rule = """\n#master-reset-modal[hidden] {\n  display: none;\n}\n"""
          assert css.count(anchor) == 1, "bloco do modal inesperado"
          assert "#master-reset-modal[hidden]" not in css, "regra hidden já existe"
          css = css.replace(anchor, anchor + rule, 1)
          css_path.write_text(css, encoding="utf-8")

          version_files = [
              Path("index.html"),
              Path("service-worker.js"),
              Path("ui-dialog.js"),
              Path("css/14-archive-inspector.css"),
              Path("css/wood-icons.css"),
          ]
          for path in version_files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old_asset)
              assert count > 0, f"versão anterior ausente em {path}"
              path.write_text(text.replace(old_asset, new_asset), encoding="utf-8")

          sw_path = Path("service-worker.js")
          sw = sw_path.read_text(encoding="utf-8")
          assert sw.count('vereda-offline-v965') == 1
          sw_path.write_text(sw.replace('vereda-offline-v965', 'vereda-offline-v966', 1), encoding="utf-8")

      - name: Validar escopo textual
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'css/02-shell-navigation.css',
              'index.html',
              'service-worker.js',
              'ui-dialog.js',
              'css/14-archive-inspector.css',
              'css/wood-icons.css',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, (changed, expected)

          diff = subprocess.check_output(['git', 'diff', '--', 'css/02-shell-navigation.css'], text=True)
          assert diff.count('#master-reset-modal[hidden]') == 1
          assert 'display: none;' in diff
          assert '!important' not in diff
          assert 'secondary-button' not in diff
          assert 'action-button' not in diff
          PY

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Testar Cancelar e confirmação textual
        shell: python
        run: |
          import json
          import subprocess
          import time
          from playwright.sync_api import sync_playwright, expect

          server = subprocess.Popen(["python", "-m", "http.server", "8811"])
          time.sleep(2)

          manuscript = {
              "id": "teste-modal-hidden",
              "title": "Teste do modal",
              "kind": "Conto",
              "type": "manuscrito",
              "status": "Em escrita",
              "text": "Texto temporário para validar o modal.",
              "createdAt": "2026-07-27T03:00:00.000Z",
              "updatedAt": "2026-07-27T03:00:00.000Z",
          }
          storage = json.dumps({
              "manuscripts": [manuscript],
              "activeId": manuscript["id"],
              "archive": {"filter": "all", "statusFilter": "all", "search": "", "sort": "updated"},
              "layout": {"leftCollapsed": True, "rightCollapsed": True},
              "ui": {},
          }, ensure_ascii=False)
          init = f"""
          localStorage.setItem('escrevaral-termos-v1','teste-modal-hidden');
          localStorage.setItem('vrda-first-visit','1');
          localStorage.setItem('vereda.manuscripts.v1',{json.dumps(storage)});
          """

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  for theme, theme_id in (("alvorada", None), ("vereda", "scriptorium")):
                      context = browser.new_context(viewport={"width": 1366, "height": 900})
                      context.add_init_script(init)
                      page = context.new_page()
                      page.goto("http://127.0.0.1:8811/#arquivo", wait_until="domcontentloaded")
                      page.wait_for_function("() => typeof setView === 'function'")
                      page.evaluate("theme => { if (theme) document.documentElement.dataset.theme = theme; else document.documentElement.removeAttribute('data-theme'); setView('arquivo',{updateRoute:false}); }", theme_id)

                      reset = page.get_by_role("button", name="Apagar tudo", exact=True)
                      reset.click()
                      modal = page.locator("#master-reset-modal")
                      expect(modal).to_be_visible()

                      cancel = modal.get_by_role("button", name="Cancelar", exact=True)
                      assert cancel.get_attribute("data-action") == "cancel-master-reset"
                      cancel.click()
                      expect(modal).to_be_hidden()
                      state = modal.evaluate("el => ({hidden: el.hidden, display: getComputedStyle(el).display})")
                      assert state == {"hidden": True, "display": "none"}, (theme, state)

                      reset.click()
                      expect(modal).to_be_visible()
                      field = modal.get_by_label("Digite apagar para confirmar")
                      destructive = modal.get_by_role("button", name="Apagar tudo mesmo assim", exact=True)
                      expect(destructive).to_be_disabled()
                      field.fill("APAGAR")
                      expect(destructive).to_be_enabled()
                      field.fill("não apagar")
                      expect(destructive).to_be_disabled()

                      modal.locator(".master-reset-backdrop").click(position={"x": 5, "y": 5})
                      expect(modal).to_be_hidden()
                      context.close()
                  browser.close()
          finally:
              server.terminate()

      - name: Commitar somente o resultado aprovado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/02-shell-navigation.css index.html service-worker.js ui-dialog.js css/14-archive-inspector.css css/wood-icons.css
          git commit -m "Corrige fechamento do modal de zerar"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
