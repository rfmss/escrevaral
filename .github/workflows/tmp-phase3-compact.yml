name: Operação temporária — condensar inventário da Fase 3

on:
  push:
    branches:
      - agent/relatorio-design-system-fase-3

permissions:
  contents: write

jobs:
  condensar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2

      - name: Criar evidência compacta por tela
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path("_tmp_phase3")
          html_all = json.loads((root / "html-map.json").read_text(encoding="utf-8"))
          js_all = json.loads((root / "js-map.json").read_text(encoding="utf-8"))

          for css_path in sorted(root.glob("css-*.json")):
              screen = css_path.stem.removeprefix("css-")
              css = json.loads(css_path.read_text(encoding="utf-8"))
              html = html_all.get(screen, {})
              js = js_all.get(screen, {})

              counts = Counter((item["category"], item["theme"]) for item in css["hardcoded"])
              samples = defaultdict(list)
              seen = defaultdict(set)
              for item in css["hardcoded"]:
                  key = f'{item["category"]}:{item["theme"]}'
                  identity = (item["property"], item["value"], item["file"])
                  if identity in seen[key] or len(samples[key]) >= 16:
                      continue
                  samples[key].append(item)
                  seen[key].add(identity)

              key_elements = []
              for item in html.get("elements", []):
                  data = item.get("data", {})
                  classes = item.get("class", [])
                  if item.get("id") or data or any(
                      token in " ".join(classes).casefold()
                      for token in ("view", "panel", "academy", "archive", "editor", "tool", "stat", "metric", "toast", "banner")
                  ):
                      key_elements.append(item)
                  if len(key_elements) >= 80:
                      break

              compact = {
                  "files": css["files"],
                  "top_tokens": list(css["token_usage"].items())[:35],
                  "hardcoded_counts": [
                      {"category": category, "theme": theme, "count": count}
                      for (category, theme), count in sorted(counts.items())
                  ],
                  "samples": dict(samples),
                  "component_selectors": {
                      key: value[:30] for key, value in css["component_selectors"].items()
                  },
                  "responsive": {
                      "count": len(css["responsive_rules"]),
                      "samples": css["responsive_rules"][:30],
                  },
                  "vereda": {
                      "count": len(css["vereda_rules"]),
                      "samples": css["vereda_rules"][:30],
                  },
                  "html": {
                      "line_matches": html.get("line_matches", [])[:160],
                      "key_elements": key_elements,
                  },
                  "javascript": {
                      "file_hit_counts": {name: len(lines) for name, lines in js.get("files", {}).items()},
                      "selectors": js.get("selectors", [])[:60],
                      "number_formatting": js.get("number_formatting", []),
                  },
              }
              (root / f"compact-{screen}.json").write_text(
                  json.dumps(compact, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Registrar condensação temporária
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmp_phase3
          git commit -m "Condensa evidências temporárias da Fase 3"
          git push origin "HEAD:${GITHUB_REF_NAME}"
