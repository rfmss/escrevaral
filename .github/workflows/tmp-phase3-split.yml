name: Operação temporária — separar inventário da Fase 3

on:
  push:
    branches:
      - agent/relatorio-design-system-fase-3

permissions:
  contents: write

jobs:
  separar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2

      - name: Separar e resumir inventários
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path("_tmp_phase3")
          html = json.loads((root / "html-map.json").read_text(encoding="utf-8"))
          js = json.loads((root / "js-map.json").read_text(encoding="utf-8"))

          for screen, payload in html.items():
              (root / f"html-{screen}.json").write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          for screen, payload in js.items():
              summary = {
                  "file_hit_counts": {name: len(lines) for name, lines in payload["files"].items()},
                  "selectors": payload["selectors"],
                  "number_formatting": payload["number_formatting"],
              }
              (root / f"js-{screen}-summary.json").write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          overview = {}
          for path in sorted(root.glob("css-*.json")):
              screen = path.stem.removeprefix("css-")
              data = json.loads(path.read_text(encoding="utf-8"))
              category_counts = Counter(item["category"] for item in data["hardcoded"])
              theme_counts = Counter(item["theme"] for item in data["hardcoded"])
              top_hardcoded = {}
              for category in category_counts:
                  values = Counter(
                      (item["property"], item["value"])
                      for item in data["hardcoded"]
                      if item["category"] == category
                  )
                  top_hardcoded[category] = [
                      {"property": prop, "value": value, "count": count}
                      for (prop, value), count in values.most_common(30)
                  ]
              overview[screen] = {
                  "files": data["files"],
                  "token_usage": data["token_usage"],
                  "hardcoded_counts": dict(category_counts),
                  "hardcoded_theme_counts": dict(theme_counts),
                  "top_hardcoded": top_hardcoded,
                  "component_counts": {key: len(value) for key, value in data["component_selectors"].items()},
                  "responsive_rule_count": len(data["responsive_rules"]),
                  "vereda_rule_count": len(data["vereda_rules"]),
              }
          (root / "overview.json").write_text(
              json.dumps(overview, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Registrar arquivos separados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmp_phase3
          git commit -m "Separa inventário temporário por tela"
          git push origin "HEAD:${GITHUB_REF_NAME}"
