name: T3 Promote Library

on:
  push:
    branches: [feat/escrevaral-paper-home]
    paths:
      - ".github/workflows/t3-promote-library.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: feat/escrevaral-paper-home
          fetch-depth: 0

      - name: Promover Biblioteca ao App
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('mass-notes-next/src/App.tsx')
          source = app.read_text()

          focus_effect = "  useEffect(() => {\n    document.body.classList.toggle('focus-mode', focusMode)\n  }, [focusMode])\n\n"
          library_effect = "  useEffect(() => {\n    document.body.classList.toggle('reference-library-open', sidebarOpen)\n    return () => document.body.classList.remove('reference-library-open')\n  }, [sidebarOpen])\n\n"
          if focus_effect not in source:
              raise SystemExit('efeito de foco não encontrado')
          if "classList.toggle('reference-library-open', sidebarOpen)" not in source:
              source = source.replace(focus_effect, focus_effect + library_effect, 1)

          start = source.find('          <section className="current-project">')
          end = source.find('          <section className="documents">', start)
          if start < 0 or end < 0:
              raise SystemExit('limites do bloco current-project não encontrados')

          lines = [
              '          <section className="current-project">',
              '            <span className="eyebrow">BIBLIOTECA LOCAL</span>',
              '            <div className="project-row">',
              '              <strong>DOCUMENTOS LOCAIS</strong>',
              '              <button',
              '                className="icon-square"',
              '                type="button"',
              "                aria-label={sidebarOpen ? 'Biblioteca local aberta' : 'Abrir biblioteca local'}",
              '                aria-controls="document-library"',
              '                aria-expanded={sidebarOpen}',
              '                onClick={() => setSidebarOpen(true)}',
              '              >',
              '                <span className="chevron" aria-hidden="true" />',
              '              </button>',
              '            </div>',
              "            <small>{projectWords.toLocaleString('pt-BR')} palavras</small>",
              '          </section>',
              '',
          ]
          source = source[:start] + '\n'.join(lines) + source[end:]
          app.write_text(source)

          main = Path('mass-notes-next/src/main.tsx')
          source = main.read_text()
          source = source.replace("import { WritingLibraryBridge } from './components/WritingLibraryBridge'\n", '', 1)
          source = source.replace('    <WritingLibraryBridge />\n', '', 1)
          if 'WritingLibraryBridge' in source:
              raise SystemExit('WritingLibraryBridge ainda montado em main.tsx')
          main.write_text(source)

          integrity = Path('mass-notes-next/src/components/WritingIntegrityBridge.tsx')
          source = integrity.read_text()
          start = source.find("  const project = document.querySelector<HTMLElement>('.left-rail .current-project')")
          end = source.find("  const research = document.querySelector<HTMLElement>('.left-rail .research')", start)
          if start < 0 or end < 0:
              raise SystemExit('bloco de integridade da Biblioteca não encontrado')
          source = source[:start] + source[end:]
          integrity.write_text(source)
          PY

      - name: Commitar promoção e remover bridge
        run: |
          git rm .github/workflows/t3-promote-library.yml
          git rm mass-notes-next/src/components/WritingLibraryBridge.tsx
          git add mass-notes-next/src/App.tsx mass-notes-next/src/main.tsx mass-notes-next/src/components/WritingIntegrityBridge.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: dar ownership React à Biblioteca"
          git push origin HEAD:feat/escrevaral-paper-home
