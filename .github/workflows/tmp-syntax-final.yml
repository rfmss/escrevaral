name: Executor final temporário da paleta sintática

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/syntax-token-palette'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: agent/syntax-token-palette
          fetch-depth: 0

      - name: Aplicar paleta aprovada
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tokens_path = Path('css/00-tokens.css')
          tokens = tokens_path.read_text(encoding='utf-8')

          light_anchor = '  --sienna: #a0522d;\n'
          light_block = '''  --sienna: #a0522d;
          --syntax-sujeito: #465A55;
          --syntax-verbo: #1250B1;
          --syntax-objeto: #5B4031;
          --syntax-adjunto: #4C2C67;
          --syntax-predicativo: #5F0032;
          --syntax-vocativo: #705103;
          --syntax-aposto: #343800;
          '''
          if tokens.count(light_anchor) != 1:
              raise SystemExit('Âncora de Alvorada inválida')
          tokens = tokens.replace(light_anchor, light_block, 1)

          dark_anchor = '  --sienna: #8c3a2b;\n'
          dark_block = '''  --sienna: #8c3a2b;
          --syntax-sujeito: #82D2A1;
          --syntax-verbo: #7B99B4;
          --syntax-objeto: #EC945E;
          --syntax-adjunto: #C99CF1;
          --syntax-predicativo: #C48590;
          --syntax-vocativo: #FBB70E;
          --syntax-aposto: #C9F28A;
          '''
          if tokens.count(dark_anchor) != 1:
              raise SystemExit('Âncora de Vereda inválida')
          tokens = tokens.replace(dark_anchor, dark_block, 1)

          legacy = '/* ─── Painel sintático — cores luminosas para temas escuros ─── */'
          following = '/* ─── Clone de dica visual — substitui title nativo ─── */'
          if legacy not in tokens or following not in tokens:
              raise SystemExit('Bloco sintático legado não localizado')
          start = tokens.index(legacy)
          end = tokens.index(following, start)
          tokens = tokens[:start] + tokens[end:]
          tokens_path.write_text(tokens, encoding='utf-8')

          precision_path = Path('css/03-inspector-precision.css')
          precision = precision_path.read_text(encoding='utf-8')
          start_marker = '.syntax-token[data-funcao="sujeito"]'
          end_marker = '.syntax-token-tooltip {'
          if start_marker not in precision or end_marker not in precision:
              raise SystemExit('Bloco efetivo do painel não localizado')
          start = precision.index(start_marker)
          end = precision.index(end_marker, start)
          rules = '''.syntax-token[data-funcao="sujeito"]     { border-color: var(--syntax-sujeito); }
          .syntax-token[data-funcao="sujeito"]     .syntax-token-label { color: var(--syntax-sujeito); }
          .syntax-token[data-funcao="verbo"]       { border-color: var(--syntax-verbo); }
          .syntax-token[data-funcao="verbo"]       .syntax-token-label { color: var(--syntax-verbo); }
          .syntax-token[data-funcao="objeto"]      { border-color: var(--syntax-objeto); }
          .syntax-token[data-funcao="objeto"]      .syntax-token-label { color: var(--syntax-objeto); }
          .syntax-token[data-funcao="adjunto"]     { border-color: var(--syntax-adjunto); }
          .syntax-token[data-funcao="adjunto"]     .syntax-token-label { color: var(--syntax-adjunto); }
          .syntax-token[data-funcao="predicativo"] { border-color: var(--syntax-predicativo); }
          .syntax-token[data-funcao="predicativo"] .syntax-token-label { color: var(--syntax-predicativo); }
          .syntax-token[data-funcao="vocativo"]    { border-color: var(--syntax-vocativo); }
          .syntax-token[data-funcao="vocativo"]    .syntax-token-label { color: var(--syntax-vocativo); }
          .syntax-token[data-funcao="aposto"]      { border-color: var(--syntax-aposto); }
          .syntax-token[data-funcao="aposto"]      .syntax-token-label { color: var(--syntax-aposto); }

          '''
          precision_path.write_text(precision[:start] + rules + precision[end:], encoding='utf-8')

          old_asset = '20260726-remove-dead-dark-themes-v2'
          new_asset = '20260726-syntax-token-palette-v1'
          for raw_path in (
              'index.html',
              'service-worker.js',
              'ui-dialog.js',
              'css/14-archive-inspector.css',
              'css/wood-icons.css',
          ):
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              if old_asset not in text:
                  raise SystemExit(f'Versão anterior ausente em {raw_path}')
              path.write_text(text.replace(old_asset, new_asset), encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          old_cache = 'const CACHE_NAME = "vereda-offline-v963";'
          if sw.count(old_cache) != 1:
              raise SystemExit('Cache v963 não localizado')
          sw_path.write_text(sw.replace(old_cache, 'const CACHE_NAME = "vereda-offline-v964";', 1), encoding='utf-8')

          for raw_path in (
              '.github/workflows/tmp-syntax-token-palette.yml',
              '.github/workflows/tmp-fix-syntax-runner.yml',
              '.github/workflows/tmp-syntax-final.yml',
              'docs/_tmp_placeholder',
          ):
              path = Path(raw_path)
              if path.exists():
                  path.unlink()
          PY

      - name: Validar escopo e valores
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          light = {
              'sujeito': '#465A55',
              'verbo': '#1250B1',
              'objeto': '#5B4031',
              'adjunto': '#4C2C67',
              'predicativo': '#5F0032',
              'vocativo': '#705103',
              'aposto': '#343800',
          }
          dark = {
              'sujeito': '#82D2A1',
              'verbo': '#7B99B4',
              'objeto': '#EC945E',
              'adjunto': '#C99CF1',
              'predicativo': '#C48590',
              'vocativo': '#FBB70E',
              'aposto': '#C9F28A',
          }

          tokens = Path('css/00-tokens.css').read_text(encoding='utf-8')
          precision = Path('css/03-inspector-precision.css').read_text(encoding='utf-8')
          root = tokens.split('}', 1)[0]
          scriptorium = re.search(r'\[data-theme="scriptorium"\]\s*\{(?P<body>.*?)\n\}', tokens, re.S)
          if not scriptorium:
              raise SystemExit('Bloco Vereda não localizado')

          for name, value in light.items():
              if f'--syntax-{name}: {value};' not in root:
                  raise SystemExit(f'Token Alvorada inválido: {name}')
              if precision.count(f'var(--syntax-{name})') != 2:
                  raise SystemExit(f'Consumo inválido: {name}')
          for name, value in dark.items():
              if f'--syntax-{name}: {value};' not in scriptorium.group('body'):
                  raise SystemExit(f'Token Vereda inválido: {name}')

          if '.syntax-token[data-funcao' in tokens:
              raise SystemExit('Seletores sintáticos legados permaneceram na camada de tokens')
          if 'vereda-offline-v964' not in Path('service-worker.js').read_text(encoding='utf-8'):
              raise SystemExit('Cache v964 ausente')
          print('Escopo e valores aprovados confirmados.')
          PY

      - name: Executar auditores
        run: |
          python3 scripts/auditor-asset-version.py
          python3 scripts/auditor-design-tokens-contrast.py
          python3 scripts/auditor-repository-boundary.py
          git diff --check

      - name: Commitar resultado final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implementa paleta sintática acessível"
          git push origin HEAD:agent/syntax-token-palette
