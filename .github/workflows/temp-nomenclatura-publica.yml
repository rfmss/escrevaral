name: Aplicar nomenclatura pública atual

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/nomenclatura-publica-escrevaral'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nomenclatura-publica-escrevaral
          fetch-depth: 0

      - name: Atualizar nomes públicos e distribuição
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, minimum=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: esperado ao menos {minimum} ocorrência(s) de {old!r}; encontrado {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: {count} substituição(ões)')

          old_version = '20260725-clarity-final-v2'
          new_version = '20260725-nomenclatura-v1'

          replace_exact(
              'index.html',
              'Oficina literária para mentes brasileiras. Escreva romance, fantasia, suspense ou poesia com guias do gênero, analise sua voz e prove que foi você quem escreveu. Gratuito, offline, sem IA.',
              'Oficina de escrita feita no Brasil, para gente brasileira. Escreva, organize manuscritos, analise sua voz e prove sua autoria — grátis e sem IA.'
          )
          replace_exact('index.html', 'Mudar para Vereda', 'Mudar para Scriptorium')
          replace_exact('index.html', old_version, new_version, minimum=20)

          replace_exact('app.js', 'biblioteca: "Biblioteca",', 'biblioteca: "Palavras",')
          replace_exact('app.js', 'arquivo: "Arquivo",', 'arquivo: "Acervo",')
          replace_exact('app.js', 'cronograma: "Cronograma",', 'cronograma: "Plano",')
          replace_exact('app.js', 'Mudar para Vereda', 'Mudar para Scriptorium')

          guide_files = [
              'vereda-titulo-do-livro.html',
              'vereda-primeiras-linhas.html',
              'vereda-revisao-manuscrito.html',
              'vereda-bloqueio-criativo.html',
          ]
          for path in guide_files:
              replace_exact(path, '>Bancada</a>', '>Ateliê</a>')

          for path in [
              'vereda-titulo-do-livro.html',
              'vereda-primeiras-linhas.html',
              'vereda-revisao-manuscrito.html',
              'vereda-bloqueio-criativo.html',
              'vereda-biblioteca-escrita.html',
              'anatomia-do-livro.html',
          ]:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              text = text.replace('Vereda ·', 'Escrevaral ·')
              text = text.replace('Mudar para Vereda', 'Mudar para Scriptorium')
              file.write_text(text, encoding='utf-8')

          replace_exact(
              'vereda-titulo-do-livro.html',
              '<meta name="twitter:title" content="O Título do Livro — Como Escolher e Criar o Título Certo | Escrevaral">',
              '<meta name="twitter:title" content="O Título do Livro — guia prático | Escrevaral">'
          )

          replace_exact('manifest.webmanifest', '"name": "Manuscrito",', '"name": "Escrever",')
          replace_exact('manifest.webmanifest', '"short_name": "Editor",', '"short_name": "Escrever",')
          replace_exact('manifest.webmanifest', '"name": "Academia",', '"name": "Ateliê",')
          replace_exact('manifest.webmanifest', '"short_name": "Academia",', '"short_name": "Ateliê",')
          replace_exact(
              'manifest.webmanifest',
              '"description": "Abrir o Escrevaral para consultar guias de escrita.",',
              '"description": "Abrir o Ateliê do Escrevaral para consultar guias de escrita.",'
          )

          replace_exact('service-worker.js', 'vereda-offline-v953', 'vereda-offline-v954')
          replace_exact('service-worker.js', old_version, new_version)

          Path('.github/workflows/temp-nomenclatura-publica.yml').unlink()

      - name: Validar substituições essenciais
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          index = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          guides = '\n'.join(Path(p).read_text(encoding='utf-8') for p in [
              'vereda-titulo-do-livro.html',
              'vereda-primeiras-linhas.html',
              'vereda-revisao-manuscrito.html',
              'vereda-bloqueio-criativo.html',
          ])

          assert 'Mudar para Vereda' not in index
          assert 'Mudar para Vereda' not in app
          assert '>Bancada</a>' not in guides
          assert 'Mudar para Scriptorium' in index
          assert 'biblioteca: "Palavras"' in app
          assert 'arquivo: "Acervo"' in app
          assert 'cronograma: "Plano"' in app
          description = re.search(r'<meta name="description" content="([^"]+)">', index).group(1)
          assert len(description) <= 160, len(description)
          shortcuts = {(s['name'], s['short_name']) for s in manifest['shortcuts']}
          assert ('Escrever', 'Escrever') in shortcuts
          assert ('Ateliê', 'Ateliê') in shortcuts
          print('Nomenclatura pública validada.')
          PY

      - name: Registrar atualização
        run: |
          git config user.name "rfmss"
          git config user.email "198406865+rfmss@users.noreply.github.com"
          git add -A
          git commit -m "fix(naming): alinhar nomes públicos ao Escrevaral"
          git push origin HEAD:fix/nomenclatura-publica-escrevaral