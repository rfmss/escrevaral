name: Verifica produção do modal de zerar em v966

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-master-reset-production-v966.yml"

permissions:
  contents: read

jobs:
  verificar-producao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter auditor técnico
        uses: actions/checkout@v4.2.2

      - name: Aguardar propagação de v966
        shell: bash
        run: |
          set -euo pipefail
          for tentativa in $(seq 1 36); do
            nonce="${GITHUB_RUN_ID}-${tentativa}-$(date +%s)"
            sw="$(curl -fsSL -H 'Cache-Control: no-cache' "https://escrevaral.com/service-worker.js?verify=${nonce}" || true)"
            css="$(curl -fsSL -H 'Cache-Control: no-cache' "https://escrevaral.com/css/02-shell-navigation.css?verify=${nonce}" || true)"
            if grep -Fq 'vereda-offline-v966' <<<"$sw" \
              && grep -Fq '20260727-master-reset-hidden-v1' <<<"$sw" \
              && grep -Eq '#master-reset-modal\[hidden\][[:space:]]*\{[[:space:]]*display[[:space:]]*:[[:space:]]*none[[:space:]]*;' <<<"$css"; then
              printf '%s' "$sw" > service-worker-production.js
              printf '%s' "$css" > shell-production.css
              echo "v966 propagado na tentativa ${tentativa}."
              exit 0
            fi
            sleep 10
          done
          echo 'v966 não propagou dentro da janela de verificação.' >&2
          exit 1

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Testar Cancelar em Alvorada e Vereda
        shell: python
        run: |
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path('reports/producao-master-reset-v966')
          out.mkdir(parents=True, exist_ok=True)

          manuscript = {
              'id': 'verificacao-v966',
              'title': 'Verificação v966',
              'kind': 'Conto',
              'type': 'manuscrito',
              'status': 'Em escrita',
              'text': 'Texto local isolado para verificar o modal.',
              'createdAt': '2026-07-27T08:00:00.000Z',
              'updatedAt': '2026-07-27T08:00:00.000Z',
          }
          storage = json.dumps({
              'manuscripts': [manuscript],
              'activeId': manuscript['id'],
              'archive': {'filter': 'all', 'statusFilter': 'all', 'search': '', 'sort': 'updated'},
              'layout': {'leftCollapsed': True, 'rightCollapsed': True},
              'ui': {},
          }, ensure_ascii=False)
          init = f"""
          localStorage.setItem('escrevaral-termos-v1','verificacao-v966');
          localStorage.setItem('vrda-first-visit','1');
          localStorage.setItem('vereda.manuscripts.v1',{json.dumps(storage)});
          """

          results = {}
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for theme, theme_id in (('alvorada', None), ('vereda', 'scriptorium')):
                  context = browser.new_context(
                      viewport={'width': 1366, 'height': 900},
                      service_workers='block',
                  )
                  context.add_init_script(init)
                  page = context.new_page()
                  errors = []
                  page.on('pageerror', lambda error: errors.append(str(error)))
                  page.goto(
                      f"https://escrevaral.com/?verify-v966={time.time_ns()}#arquivo",
                      wait_until='domcontentloaded',
                      timeout=60000,
                  )
                  page.wait_for_function("() => typeof setView === 'function'", timeout=30000)
                  page.evaluate("""theme => {
                    if (theme) document.documentElement.dataset.theme = theme;
                    else document.documentElement.removeAttribute('data-theme');
                    setView('arquivo', { updateRoute: false });
                  }""", theme_id)
                  page.wait_for_function("() => document.querySelector('.app-shell')?.dataset.view === 'arquivo'")

                  trigger = page.locator('[data-view-panel="arquivo"] button[data-action="master-reset"]')
                  trigger.click()
                  modal = page.locator('#master-reset-modal')
                  modal.wait_for(state='visible')

                  destructive = modal.locator('#master-reset-confirm-btn')
                  confirmation = modal.locator('#master-reset-input')
                  assert destructive.is_disabled(), f'{theme}: botão destrutivo deveria iniciar desabilitado'
                  confirmation.fill('APAGAR')
                  assert destructive.is_enabled(), f'{theme}: APAGAR deveria habilitar o botão destrutivo'
                  confirmation.fill('texto divergente')
                  assert destructive.is_disabled(), f'{theme}: texto divergente deveria desabilitar novamente'

                  before = modal.evaluate("el => ({hidden: el.hidden, display: getComputedStyle(el).display})")
                  modal.locator('button[data-action="cancel-master-reset"]').click()
                  page.wait_for_function("""() => {
                    const el = document.querySelector('#master-reset-modal');
                    return el && el.hidden === true && getComputedStyle(el).display === 'none';
                  }""", timeout=10000)
                  after = modal.evaluate("el => ({hidden: el.hidden, display: getComputedStyle(el).display, visible: !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length)})")
                  assert after == {'hidden': True, 'display': 'none', 'visible': False}, (theme, after)
                  assert not errors, f'{theme}: erros de página: {errors}'

                  page.screenshot(path=str(out / f'acervo-{theme}-apos-cancelar.png'), full_page=True)
                  results[theme] = {
                      'antes': before,
                      'depois': after,
                      'confirmacao_textual_preservada': True,
                      'erros_de_pagina': errors,
                  }
                  context.close()
              browser.close()

          (out / 'resultado.json').write_text(
              json.dumps(results, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(json.dumps(results, ensure_ascii=False, indent=2))

      - name: Guardar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: producao-master-reset-v966-${{ github.run_id }}
          path: |
            reports/producao-master-reset-v966/
            service-worker-production.js
            shell-production.css
          retention-days: 14
