name: Migração da candidata Argila

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  migrar:
    if: github.head_ref == 'stabilize/release-candidate-argila'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Aplicar migração
        run: python scripts/migrar-release-candidate-argila.py

      - name: Validar sintaxe e distribuição
        run: |
          python -m py_compile scripts/auditor-dados.py scripts/auditor-privacidade-rede.py
          node --check service-worker.js
          node --check oficina-navigation-controller.js
          grep -q '20260725-release-candidate' index.html
          grep -q 'vereda-offline-v949' service-worker.js

      - name: Registrar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): eliminar P1 reproduzidos e alinhar auditores"
          git push origin HEAD:${{ github.head_ref }}
