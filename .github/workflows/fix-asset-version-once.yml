name: Aplicar versão global de arquivos

on:
  push:
    branches:
      - fix/asset-version-20260725
    paths:
      - ".github/workflows/fix-asset-version-once.yml"

permissions:
  contents: write

jobs:
  versionar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          ref: fix/asset-version-20260725
          fetch-depth: 0

      - name: Atualizar identificadores
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "20260724-v936"
          new = "20260725-palavras"

          index = Path("index.html")
          index_text = index.read_text(encoding="utf-8")
          occurrences = index_text.count(old)
          if occurrences < 60:
              raise SystemExit(f"Esperava ao menos 60 referências antigas no index; encontrei {occurrences}.")
          index.write_text(index_text.replace(old, new), encoding="utf-8")

          sw = Path("service-worker.js")
          sw_text = sw.read_text(encoding="utf-8")
          required = [
              'const CACHE_NAME = "vereda-offline-v942";',
              'const ASSET_VERSION = "20260724-v936";',
              '"./lexical-view-controller.js?v=20260725-v1"',
          ]
          missing = [token for token in required if token not in sw_text]
          if missing:
              raise SystemExit(f"Service worker não corresponde à base esperada: {missing}")
          sw_text = sw_text.replace(
              'const CACHE_NAME = "vereda-offline-v942";',
              'const CACHE_NAME = "vereda-offline-v943";',
          )
          sw_text = sw_text.replace(
              'const ASSET_VERSION = "20260724-v936";',
              'const ASSET_VERSION = "20260725-palavras";',
          )
          sw_text = sw_text.replace(
              '"./lexical-view-controller.js?v=20260725-v1"',
              '`./lexical-view-controller.js?v=${ASSET_VERSION}`',
          )
          sw.write_text(sw_text, encoding="utf-8")

          ui = Path("ui-dialog.js")
          ui_text = ui.read_text(encoding="utf-8")
          old_controller = "./lexical-view-controller.js?v=20260725-v1"
          if old_controller not in ui_text:
              raise SystemExit("Versão esperada do controlador lexical não encontrada em ui-dialog.js")
          ui.write_text(
              ui_text.replace(old_controller, "./lexical-view-controller.js?v=20260725-palavras"),
              encoding="utf-8",
          )

          Path(".github/workflows/fix-asset-version-once.yml").unlink()
          PY

      - name: Confirmar substituição
        run: |
          test "$(grep -o '20260724-v936' index.html | wc -l)" -eq 0
          test "$(grep -o '20260725-palavras' index.html | wc -l)" -ge 60
          grep -F 'const CACHE_NAME = "vereda-offline-v943";' service-worker.js
          grep -F 'const ASSET_VERSION = "20260725-palavras";' service-worker.js
          grep -F './lexical-view-controller.js?v=20260725-palavras' ui-dialog.js
          test ! -e .github/workflows/fix-asset-version-once.yml

      - name: Gravar correção na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js ui-dialog.js .github/workflows/fix-asset-version-once.yml
          git commit -m "chore: versionar arquivos da entrega Palavras"
          git push origin HEAD:fix/asset-version-20260725
