name: Correção da primeira auditoria — Oficina e Autoria

on:
  push:
    branches:
      - clarity/desktop-workshop-authorship
    paths:
      - scripts/fix-clarity-workshop-run1.py
      - .github/workflows/fix-clarity-workshop-run1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: clarity/desktop-workshop-authorship
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Aplicar correções
        run: python3 scripts/fix-clarity-workshop-run1.py
      - name: Validar sintaxe
        run: |
          node --check workshop-authorship-clarity-controller.js
          python -m py_compile scripts/auditor-product-clarity-workshop.py
      - name: Registrar e limpar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop-authorship-clarity-controller.js scripts/auditor-product-clarity-workshop.py
          git rm scripts/fix-clarity-workshop-run1.py .github/workflows/fix-clarity-workshop-run1.yml
          git commit -m "fix(clarity): preserve mobile authorship flow"
          git push origin HEAD:clarity/desktop-workshop-authorship
