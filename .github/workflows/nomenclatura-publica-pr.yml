name: Validação da nomenclatura pública

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "vereda-*.html"
      - "scripts/auditor-nomenclatura-publica.py"
      - ".github/workflows/nomenclatura-publica-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nomenclatura-publica-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar sintaxe
        run: python -m py_compile scripts/auditor-nomenclatura-publica.py

      - name: Servir branch
        run: |
          python -m http.server 8799 > /tmp/escrevaral-naming-server.log 2>&1 &
          for tentativa in {1..30}; do
            curl --fail --silent http://127.0.0.1:8799/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/escrevaral-naming-server.log
          exit 1

      - name: Auditar nomenclatura pública
        run: python scripts/auditor-nomenclatura-publica.py

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomenclatura-publica-${{ github.run_id }}
          path: reports/auditoria/nomenclatura-publica-artifacts/
          retention-days: 14
