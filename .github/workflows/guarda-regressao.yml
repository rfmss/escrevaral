name: Guarda de Regressão — Corpus Arnaldo

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  guarda:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Iniciar servidor local
        run: python3 -m http.server 8799 &
        working-directory: ${{ github.workspace }}

      - name: Aguardar servidor
        run: sleep 2

      - name: Rodar corpus do Catedrático
        id: corpus
        run: |
          python3 scripts/comparar-golden.py && echo "status=0" >> "$GITHUB_OUTPUT" || echo "status=1" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Auditor overflow mobile
        id: overflow
        run: |
          python3 scripts/auditor-overflow-mobile.py && echo "status=0" >> "$GITHUB_OUTPUT" || echo "status=1" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Auditor console errors
        id: console_errors
        run: |
          python3 scripts/auditor-console-errors.py && echo "status=0" >> "$GITHUB_OUTPUT" || echo "status=1" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Smoke test site live
        id: live
        run: |
          python3 scripts/smoke-live.py && echo "status=0" >> "$GITHUB_OUTPUT" || echo "status=1" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Guardar relatórios como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guarda-regressao-${{ github.run_id }}
          path: |
            reports/agente/
            reports/auditoria/
          if-no-files-found: warn
          retention-days: 14

      - name: Abrir ou atualizar incidente
        if: steps.corpus.outputs.status == '1' || steps.overflow.outputs.status == '1' || steps.console_errors.outputs.status == '1' || steps.live.outputs.status == '1'
        run: |
          DATA=$(date +%Y-%m-%d)
          RELATORIO_CORPUS=$(cat reports/agente/${DATA}.md 2>/dev/null || echo "Relatório não encontrado.")
          RELATORIO_OVERFLOW=$(cat reports/auditoria/overflow-mobile-${DATA}.md 2>/dev/null || echo "")
          RELATORIO_CONSOLE=$(cat reports/auditoria/console-errors-${DATA}.md 2>/dev/null || echo "")
          RELATORIO_LIVE=$(cat reports/auditoria/smoke-live-${DATA}.md 2>/dev/null || echo "")

          gh label create "regressao" --color "e11d48" \
            --description "Regressão detectada pelo guarda" 2>/dev/null || true
          gh label create "auditoria" --color "f59e0b" \
            --description "Violação detectada pelos auditores" 2>/dev/null || true
          gh label create "site-live" --color "7c3aed" \
            --description "Falha detectada no site em produção" 2>/dev/null || true
          gh label create "incidente-automatizado" --color "b91c1c" \
            --description "Incidente mantido por automação" 2>/dev/null || true

          LABELS="regressao,incidente-automatizado"
          if [ "${{ steps.overflow.outputs.status }}" = "1" ] || [ "${{ steps.console_errors.outputs.status }}" = "1" ]; then
            LABELS="${LABELS},auditoria"
          fi
          if [ "${{ steps.live.outputs.status }}" = "1" ]; then
            LABELS="${LABELS},site-live"
          fi

          CORPO="$(printf \
            'Nova falha detectada em %s.\n\nExecução: %s/actions/runs/%s\n\n## Site live\n\n%s\n\n## Corpus das engines\n\n%s\n\n## Overflow mobile\n\n%s\n\n## Erros de console\n\n%s' \
            "$DATA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$RELATORIO_LIVE" "$RELATORIO_CORPUS" "$RELATORIO_OVERFLOW" "$RELATORIO_CONSOLE")"

          ISSUE=$(gh issue list \
            --state open \
            --label "regressao" \
            --search '"Guarda de regressão falhando" in:title' \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" \
              --title "Guarda de regressão falhando — última ocorrência $DATA" \
              --add-label "$LABELS"
            gh issue comment "$ISSUE" --body "$CORPO"
          else
            gh issue create \
              --title "Guarda de regressão falhando — última ocorrência $DATA" \
              --body "$CORPO" \
              --label "$LABELS"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fechar incidente após recuperação
        if: steps.corpus.outputs.status == '0' && steps.overflow.outputs.status == '0' && steps.console_errors.outputs.status == '0' && steps.live.outputs.status == '0'
        run: |
          DATA=$(date +%Y-%m-%d)
          ISSUE=$(gh issue list \
            --state open \
            --label "regressao" \
            --search '"Guarda de regressão falhando" in:title' \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" \
              --body "Recuperação confirmada em $DATA. O guarda voltou ao estado verde na execução $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
            gh issue close "$ISSUE" --reason completed
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumo da execução
        if: always()
        run: |
          DATA=$(date +%Y-%m-%d)
          echo "### Guarda de regressão — $DATA" >> "$GITHUB_STEP_SUMMARY"
          echo "Corpus: ${{ steps.corpus.outputs.status == '0' && '✅' || '❌' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Overflow mobile: ${{ steps.overflow.outputs.status == '0' && '✅' || '❌' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Erros de console: ${{ steps.console_errors.outputs.status == '0' && '✅' || '❌' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Site live: ${{ steps.live.outputs.status == '0' && '✅' || '❌' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Relatórios completos disponíveis como artefato desta execução." >> "$GITHUB_STEP_SUMMARY"
