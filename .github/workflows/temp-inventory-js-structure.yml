name: Inventariar estrutura JavaScript

on:
  push:
    branches:
      - refactor/js-structure-inventory

permissions:
  contents: write

jobs:
  inventariar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar branch
        uses: actions/checkout@v4
        with:
          ref: refactor/js-structure-inventory
          fetch-depth: 0

      - name: Gerar inventário estrutural
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          root_js = sorted(p for p in root.glob('*.js') if p.is_file())
          htmls = sorted(p for p in root.glob('*.html') if p.is_file())

          def categoria(nome):
              if nome.endswith('-engine.js'):
                  return 'engines'
              if nome.endswith('-controller.js'):
                  return 'controllers'
              if nome.endswith('-data.js') or nome in {'criterios-data.js'}:
                  return 'data'
              return 'core'

          grupos = {k: [] for k in ('engines', 'controllers', 'data', 'core')}
          for p in root_js:
              grupos[categoria(p.name)].append(p.name)

          scripts_por_html = {}
          script_re = re.compile(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']', re.I)
          for html in htmls:
              texto = html.read_text(encoding='utf-8', errors='ignore')
              scripts_por_html[html.name] = script_re.findall(texto)

          extensoes = {'.html', '.js', '.json', '.py', '.yml', '.yaml', '.md', '.webmanifest', '.xml'}
          arquivos_texto = [
              p for p in root.rglob('*')
              if p.is_file() and '.git' not in p.parts and p.suffix.lower() in extensoes
              and p.name != 'temp-inventory-js-structure.yml'
          ]

          referencias = {}
          for js in root_js:
              refs = []
              alvo = js.name
              for arq in arquivos_texto:
                  try:
                      texto = arq.read_text(encoding='utf-8', errors='ignore')
                  except OSError:
                      continue
                  if alvo in texto and arq.resolve() != js.resolve():
                      refs.append(arq.as_posix())
              referencias[alvo] = sorted(set(refs))

          fetches = []
          dinamicos = []
          fetch_re = re.compile(r'fetch\s*\(\s*["\']([^"\']+)["\']')
          dynamic_patterns = {
              'import()': re.compile(r'import\s*\(\s*["\']([^"\']+)["\']'),
              'new Worker': re.compile(r'new\s+Worker\s*\(\s*["\']([^"\']+)["\']'),
              'importScripts': re.compile(r'importScripts\s*\(\s*["\']([^"\']+)["\']'),
              'script.src': re.compile(r'\.src\s*=\s*["\']([^"\']+)["\']'),
          }
          for js in root_js:
              texto = js.read_text(encoding='utf-8', errors='ignore')
              for alvo in fetch_re.findall(texto):
                  fetches.append((js.name, alvo))
              for tipo, padrao in dynamic_patterns.items():
                  for alvo in padrao.findall(texto):
                      dinamicos.append((js.name, tipo, alvo))

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8', errors='ignore') if sw.exists() else ''
          no_cache = [js.name for js in root_js if js.name not in sw_text]

          linhas = [
              '# Reavaliação da estrutura JavaScript da raiz — 2026-07-25',
              '',
              '**Situação:** decisão arquitetural reaberta; migração ainda não executada.',
              '',
              '## Motivo',
              '',
              'A decisão anterior em `docs/_decisoes/ESTRUTURA_RAIZ.md` manteve os arquivos de distribuição na raiz e determinou que a estrutura fosse reavaliada quando o projeto ultrapassasse 50 arquivos JavaScript ou adotasse uma etapa de build.',
              '',
              f'A raiz contém atualmente **{len(root_js)} arquivos `.js`**. A condição de reavaliação foi atingida.',
              '',
              '## Inventário por função',
              '',
          ]

          destinos = {
              'engines': 'js/engines/',
              'controllers': 'js/controllers/',
              'data': 'js/data/',
              'core': 'js/core/',
          }
          titulos = {
              'engines': 'Engines',
              'controllers': 'Controladores',
              'data': 'Dados JavaScript',
              'core': 'Núcleo e utilitários',
          }
          for grupo in ('engines', 'controllers', 'data', 'core'):
              linhas += [f'### {titulos[grupo]} — {len(grupos[grupo])}', '', f'Destino proposto: `{destinos[grupo]}`', '']
              linhas += [f'- `{nome}` → `{destinos[grupo]}{nome}`' for nome in grupos[grupo]] or ['- Nenhum arquivo.']
              linhas.append('')

          linhas += ['## HTML da raiz e scripts carregados', '']
          for html, scripts in scripts_por_html.items():
              locais = [s for s in scripts if not re.match(r'^(https?:)?//', s)]
              linhas += [f'### `{html}`', '', f'- scripts totais: {len(scripts)}', f'- scripts locais: {len(locais)}']
              linhas += [f'  - `{s}`' for s in locais] or ['  - nenhum']
              linhas.append('')

          linhas += ['## Carregamentos internos que exigem atualização', '', '### `fetch()` com caminho literal', '']
          linhas += [f'- `{origem}` → `{alvo}`' for origem, alvo in sorted(fetches)] or ['- Nenhum caminho literal encontrado.']
          linhas += ['', '### Carregamentos dinâmicos', '']
          linhas += [f'- `{origem}` — {tipo}: `{alvo}`' for origem, tipo, alvo in sorted(dinamicos)] or ['- Nenhum carregamento dinâmico literal encontrado.']

          linhas += ['', '## Cobertura do service worker', '']
          if no_cache:
              linhas += ['Arquivos JavaScript da raiz cujo nome não aparece literalmente em `service-worker.js`:', '']
              linhas += [f'- `{nome}`' for nome in no_cache]
          else:
              linhas += ['Todos os arquivos JavaScript da raiz aparecem literalmente em `service-worker.js`.']

          linhas += ['', '## Arquivos que referenciam cada JavaScript', '']
          for nome in sorted(referencias):
              refs = referencias[nome]
              linhas.append(f'### `{nome}`')
              linhas.append('')
              linhas += [f'- `{r}`' for r in refs] or ['- Nenhuma referência textual fora do próprio arquivo.']
              linhas.append('')

          linhas += [
              '## Barreiras obrigatórias antes de mover',
              '',
              '1. Atualizar todos os `<script src>` dos HTML da raiz.',
              '2. Atualizar caminhos literais em `fetch()`, `import()`, workers e scripts criados dinamicamente.',
              '3. Atualizar `CORE_ASSETS` e qualquer outra lista do `service-worker.js`.',
              '4. Atualizar auditores, workflows e documentação operacional que usam caminhos antigos.',
              '5. Promover `ASSET_VERSION`, `CACHE_NAME` e todos os `?v=` de distribuição.',
              '6. Rodar servidor local, Teste Master, Playwright headless, overflow móvel, console, foco, dados e candidata a lançamento.',
              '7. Revisar capturas em Alvorada e Scriptorium.',
              '8. Fazer push apenas nesta branch; não incorporar automaticamente.',
              '',
              '## Deliberação desta etapa',
              '',
              'A migração é tecnicamente justificável pelo crescimento da raiz, mas ainda não foi realizada. Esta branch existe para tornar o custo e os pontos de sincronização observáveis antes de qualquer movimentação de arquivos.',
              '',
              'Próxima etapa autorizada: implementar a migração nesta mesma branch em commits pequenos, começando por uma categoria e mantendo compatibilidade offline comprovada.',
          ]

          destino = Path('docs/_decisoes/REAVALIACAO_ESTRUTURA_JS_2026-07-25.md')
          destino.write_text('\n'.join(linhas) + '\n', encoding='utf-8')
          Path('.github/workflows/temp-inventory-js-structure.yml').unlink()

      - name: Registrar inventário
        run: |
          git config user.name "rfmss"
          git config user.email "198406865+rfmss@users.noreply.github.com"
          git add docs/_decisoes/REAVALIACAO_ESTRUTURA_JS_2026-07-25.md .github/workflows/temp-inventory-js-structure.yml
          git commit -m "docs(structure): inventariar dependências da raiz JavaScript"
          git push origin HEAD:refactor/js-structure-inventory
