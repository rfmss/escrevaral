name: Atualização e recarga offline da PWA

on:
  pull_request:
    branches: [main]
    paths:
      - "service-worker.js"
      - "index.html"
      - "manifest.webmanifest"
      - "scripts/auditor-pwa-upgrade.py"
      - ".github/workflows/pwa-upgrade-pr.yml"
      - ".github/workflows/release-candidate-argila.yml"
      - "docs/release/**"

permissions:
  contents: read

concurrency:
  group: pwa-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar sintaxe
        run: python -m py_compile scripts/auditor-pwa-upgrade.py

      - name: Iniciar candidata local
        run: |
          python3 -m http.server 8799 > /tmp/escrevaral-pwa-upgrade.log 2>&1 &
          echo $! > /tmp/escrevaral-pwa-upgrade.pid
          for tentativa in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8799/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/escrevaral-pwa-upgrade.log
          exit 1

      - name: Testar atualização da PWA
        env:
          ESCREVARAL_AUDIT_URL: http://127.0.0.1:8799
        run: python scripts/auditor-pwa-upgrade.py

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-upgrade-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            reports/auditoria/pwa-upgrade-artifacts/**
            /tmp/escrevaral-pwa-upgrade.log
