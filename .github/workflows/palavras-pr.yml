name: Validação de Palavras

on:
  pull_request:
    branches:
      - main
    paths:
      - "lexical-view-controller.js"
      - "ui-dialog.js"
      - "styles.css"
      - "service-worker.js"
      - "scripts/auditor-palavras.py"
      - ".github/workflows/palavras-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: palavras-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Validar sintaxe do auditor
        run: python -m py_compile scripts/auditor-palavras.py

      - name: Iniciar Escrevaral local
        run: |
          python3 -m http.server 8799 > /tmp/escrevaral-http.log 2>&1 &
          echo $! > /tmp/escrevaral-http.pid
          for tentativa in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8799/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/escrevaral-http.log
          exit 1

      - name: Guarda de regressão das engines
        id: golden
        continue-on-error: true
        run: python3 scripts/comparar-golden.py

      - name: Auditor de overflow mobile
        id: overflow
        continue-on-error: true
        run: python3 scripts/auditor-overflow-mobile.py

      - name: Auditor de erros no console
        id: console
        continue-on-error: true
        run: python3 scripts/auditor-console-errors.py

      - name: Contexto, busca e continuidade offline
        id: palavras
        continue-on-error: true
        run: |
          python3 scripts/auditor-palavras.py \
            --base-url http://127.0.0.1:8799/ \
            --output-dir reports/auditoria/palavras-artifacts

      - name: Preparar evidências
        if: always()
        run: |
          DATA=$(date +%Y-%m-%d)
          DESTINO=artifacts/palavras
          mkdir -p "$DESTINO"
          cp -R reports/auditoria/palavras-artifacts "$DESTINO/" 2>/dev/null || true
          cp "reports/auditoria/overflow-mobile-${DATA}.md" "$DESTINO/" 2>/dev/null || true
          cp "reports/auditoria/overflow-mobile-${DATA}.json" "$DESTINO/" 2>/dev/null || true
          cp "reports/auditoria/console-errors-${DATA}.md" "$DESTINO/" 2>/dev/null || true
          cp "reports/auditoria/console-errors-${DATA}.json" "$DESTINO/" 2>/dev/null || true
          cp "reports/agente/${DATA}.md" "$DESTINO/" 2>/dev/null || true
          cp "reports/agente/${DATA}.json" "$DESTINO/" 2>/dev/null || true
          cp /tmp/escrevaral-http.log "$DESTINO/" 2>/dev/null || true
          find "$DESTINO" -type f -maxdepth 5 -print

      - name: Guardar relatórios e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palavras-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/palavras/**

      - name: Consolidar resultado
        if: always()
        run: |
          echo "golden=${{ steps.golden.outcome }}"
          echo "overflow=${{ steps.overflow.outcome }}"
          echo "console=${{ steps.console.outcome }}"
          echo "palavras=${{ steps.palavras.outcome }}"

          falhou=0
          for resultado in \
            "${{ steps.golden.outcome }}" \
            "${{ steps.overflow.outcome }}" \
            "${{ steps.console.outcome }}" \
            "${{ steps.palavras.outcome }}"; do
            if [ "$resultado" != "success" ]; then
              falhou=1
            fi
          done

          if [ "$falhou" -ne 0 ]; then
            echo "Uma ou mais validações falharam. Consulte os relatórios e capturas."
            exit 1
          fi

          echo "Palavras aprovada em contexto, busca e funcionamento offline."
