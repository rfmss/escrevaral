name: Operação temporária — componentes exatos da Fase 3

on:
  push:
    branches:
      - agent/relatorio-design-system-fase-3

permissions:
  contents: write

jobs:
  mapear:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2

      - name: Instalar parser temporário
        run: npm install --prefix /tmp/phase3-exact postcss@8.4.49

      - name: Mapear seletores por raízes exatas
        run: |
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const postcss = require('/tmp/phase3-exact/node_modules/postcss');

          const groups = {
            editor: [/\.editor[-\w]*/i, /\.writing-area\b/i, /\.format-bar\b/i, /\.fmt[-\w]*/i, /\.title-input\b/i],
            acervo: [/\.archive[-\w]*/i, /\.project[-\w]*/i, /\.resume-document[-\w]*/i, /\.metadata-form\b/i],
            oficina: [/\.academy[-\w]*/i, /\[data-atelier-/i, /\.workshop[-\w]*/i],
            palavras: [/\.lexical[-\w]*/i, /\[data-lexical-/i, /\.word-cloud\b/i],
            rimas: [/\.rimalab[-\w]*/i, /\[data-rimalab-/i],
            vocabulario: [/\.decolonial[-\w]*/i, /\[data-decolonial-/i],
            leituras: [/\.academia-biblioteca-frame\b/i, /\.leitura-editorial[-\w]*/i, /\.reader[-\w]*/i],
            pratica: [/\.training[-\w]*/i, /\.deriva[-\w]*/i, /\.fio[-\w]*/i, /\.ed-exercise\b/i],
            autoria: [/\.certificate[-\w]*/i, /\.proof[-\w]*/i, /\[data-proof-/i],
            'painel-linguistico': [/\.precision[-\w]*/i, /\.syntax[-\w]*/i, /\.inspector[-\w]*/i],
          };

          const files = [];
          const walk = dir => {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith('.css')) files.push(full.replace(/\\/g, '/'));
            }
          };
          walk('css');
          for (const extra of ['styles.css', 'vereda-editorial.css']) if (fs.existsSync(extra)) files.push(extra);

          const results = Object.fromEntries(Object.keys(groups).map(name => [name, []]));
          for (const file of files.sort()) {
            const root = postcss.parse(fs.readFileSync(file, 'utf8'), {from:file});
            root.walkRules(rule => {
              for (const [name, patterns] of Object.entries(groups)) {
                if (!patterns.some(pattern => pattern.test(rule.selector))) continue;
                const declarations = [];
                rule.walkDecls(decl => declarations.push({property: decl.prop, value: decl.value, line: decl.source.start.line}));
                results[name].push({
                  file,
                  line: rule.source.start.line,
                  selector: rule.selector,
                  media: rule.parent && rule.parent.type === 'atrule' && rule.parent.name === 'media' ? rule.parent.params : null,
                  theme: rule.selector.includes('[data-theme="scriptorium"]') ? 'Vereda' : 'base/Alvorada',
                  declarations,
                });
              }
            });
          }

          fs.mkdirSync('_tmp_phase3', {recursive:true});
          for (const [name, rules] of Object.entries(results)) {
            const filesCount = {};
            const literalColors = [];
            const typography = [];
            const spacing = [];
            const tokens = {};
            for (const rule of rules) {
              filesCount[rule.file] = (filesCount[rule.file] || 0) + 1;
              for (const decl of rule.declarations) {
                for (const match of decl.value.matchAll(/var\((--[a-z0-9-]+)/gi)) tokens[match[1]] = (tokens[match[1]] || 0) + 1;
                if (/color|background|border|outline|shadow|fill|stroke/.test(decl.property) && /#[0-9a-f]{3,8}\b|rgba?\(|hsla?\(|\bwhite\b|\bblack\b/.test(decl.value)) literalColors.push({...rule, declarations: undefined, property:decl.property, value:decl.value, declarationLine:decl.line});
                if (/font-family|font-size|font-weight|line-height|letter-spacing/.test(decl.property) && !decl.value.includes('var(--')) typography.push({...rule, declarations: undefined, property:decl.property, value:decl.value, declarationLine:decl.line});
                if (/^(margin|padding|gap|row-gap|column-gap|inset|top|right|bottom|left|min-width|max-width|width|min-height|max-height|height)$/.test(decl.property) && /\d(?:px|rem|em|vw|vh|dvw|dvh|%|ch|mm)/.test(decl.value) && !decl.value.includes('var(--')) spacing.push({...rule, declarations: undefined, property:decl.property, value:decl.value, declarationLine:decl.line});
              }
            }
            const payload = {
              rule_count: rules.length,
              files: filesCount,
              token_usage: Object.fromEntries(Object.entries(tokens).sort((a,b)=>b[1]-a[1])),
              literal_colors: literalColors,
              typography,
              spacing,
              rules,
            };
            fs.writeFileSync(`_tmp_phase3/exact-${name}.json`, JSON.stringify(payload, null, 2) + '\n');
          }
          JS

      - name: Registrar mapa exato temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmp_phase3
          git commit -m "Mapeia componentes exatos da Fase 3"
          git push origin "HEAD:${GITHUB_REF_NAME}"
