name: Aplicar fronteira do repositório público

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    if: github.head_ref == 'agent/public-repository-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          ref: agent/public-repository-boundary
          fetch-depth: 1

      - name: Limpar saídas geradas e documentar fronteira
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports
          mkdir -p reports docs/_decisoes

          cat > reports/README.md <<'EOF'
          # Relatórios gerados

          Este diretório existe apenas como destino convencional para auditores locais e workflows.

          Relatórios, capturas, arquivos JSON, logs e resultados datados são saídas de execução. Eles não fazem parte do código-fonte e não devem ser incorporados à `main`.

          Onde consultar resultados:

          - execução atual: resumo do GitHub Actions;
          - evidência temporária: artefato anexado ao workflow;
          - decisão durável: registro curado em `docs/_decisoes/`, quando o resultado justificar uma mudança de produto ou arquitetura.

          Os scripts podem recriar livremente subdiretórios dentro de `reports/`. Todo conteúdo, exceto este README, é ignorado pelo Git.
          EOF

          cat > docs/_decisoes/FRONTEIRA_REPOSITORIO_PUBLICO_2026-07-26.md <<'EOF'
          # Fronteira do repositório público

          Data: 2026-07-26

          ## Problema observado

          O repositório público acumulou dezenas de relatórios datados produzidos por auditorias locais e automáticas. Esses arquivos repetiam resultados que já podem ser preservados como resumos e artefatos do GitHub Actions, aumentavam o ruído da navegação e faziam saídas de execução parecerem documentação vigente.

          ## Decisão

          `reports/` deixa de armazenar resultados versionados. Apenas `reports/README.md` permanece na árvore.

          Resultados automáticos devem ser mantidos como:

          - resumo da execução;
          - artefato temporário do workflow;
          - registro curado em `docs/_decisoes/` somente quando houver uma decisão durável.

          ## O que permanece público

          - código executável do produto;
          - service worker, manifestos e ativos necessários à publicação;
          - testes, auditores e workflows reproduzíveis;
          - documentação atual;
          - decisões arquiteturais duráveis;
          - arquivos de governança e suporte.

          ## O que não deve voltar à `main`

          - relatórios datados de execução;
          - capturas automáticas;
          - logs, estados e arquivos temporários;
          - resultados verdes repetitivos;
          - credenciais ou infraestrutura local.

          ## Material operacional ainda presente

          Agentes, habilidades e personas não são removidos por esta decisão. Eles só devem sair do repositório público depois que houver um repositório privado dedicado e uma cópia verificada. Repositórios privados de outros projetos não serão reutilizados como destino improvisado.

          ## Reabertura

          Esta decisão pode ser revista quando um relatório específico funcionar como fixture estável ou baseline indispensável. Nesse caso, ele deve ser movido para uma pasta de testes com nome e contrato explícitos, não devolvido ao diretório genérico `reports/`.
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path('.gitignore')
          text = path.read_text(encoding='utf-8').rstrip()
          marker = '# ── Saídas geradas por auditorias e testes'
          if marker not in text:
              text += '''

          # ── Saídas geradas por auditorias e testes ────────────────────────
          reports/**
          !reports/README.md'''
          path.write_text(text + '\n', encoding='utf-8')
          PY

      - name: Validar fronteira
        shell: bash
        run: |
          set -euo pipefail
          test -f reports/README.md
          test -f docs/_decisoes/FRONTEIRA_REPOSITORIO_PUBLICO_2026-07-26.md
          grep -Fx 'reports/**' .gitignore
          grep -Fx '!reports/README.md' .gitignore
          git check-ignore reports/exemplo.json
          test "$(find reports -type f | sort)" = 'reports/README.md'

      - name: Gravar lote
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A reports .gitignore docs/_decisoes/FRONTEIRA_REPOSITORIO_PUBLICO_2026-07-26.md
          git diff --cached --check
          git commit -m 'chore(repo): limpar relatórios gerados'
          git push origin HEAD:agent/public-repository-boundary
