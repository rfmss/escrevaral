name: Candidata a lançamento Argila

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-producao:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar sintaxe dos auditores de produção
        run: |
          python -m py_compile \
            scripts/teste-master.py \
            scripts/auditor-publicacao.py \
            scripts/auditor-privacidade-rede.py \
            scripts/auditoria-pilares.py \
            scripts/auditor-navegacao-visual.py

      - name: Executar Teste Master de produção
        id: master
        shell: bash
        run: |
          set +e
          python scripts/teste-master.py --sem-local
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: |
            reports/teste-master/
            reports/auditoria/
          retention-days: 14

      - name: Consolidar veredito
        if: always()
        run: |
          test "${{ steps.master.outputs.exit_code }}" = "0"
