name: Piloto estrutural temporário — controladores

on:
  push:
    branches:
      - agent/js-controllers-pilot

permissions:
  contents: write

jobs:
  migrar-controladores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clonar branch do piloto
        uses: actions/checkout@v4.2.2
        with:
          ref: agent/js-controllers-pilot
          fetch-depth: 0

      - name: Migrar três controladores sem alterar comportamento
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_version = "20260725-js-data-pilot-v1"
          new_version = "20260725-js-controllers-pilot-v1"
          moves = {
              "tooltip-controller.js": "js/controllers/tooltip-controller.js",
              "pomodoro-controller.js": "js/controllers/pomodoro-controller.js",
              "reader-controller.js": "js/controllers/reader-controller.js",
          }

          for source_name, target_name in moves.items():
              source = Path(source_name)
              target = Path(target_name)
              assert source.is_file(), f"arquivo de origem ausente: {source}"
              assert not target.exists(), f"destino já existe: {target}"
              target.parent.mkdir(parents=True, exist_ok=True)
              source.rename(target)

          index = Path("index.html")
          index_text = index.read_text(encoding="utf-8")
          assert old_version in index_text, "versão anterior ausente em index.html"
          index_text = index_text.replace(old_version, new_version)
          for source_name, target_name in moves.items():
              assert source_name in index_text, f"consumidor ausente no index: {source_name}"
              index_text = index_text.replace(source_name, target_name)
          index.write_text(index_text, encoding="utf-8")

          service_worker = Path("service-worker.js")
          sw_text = service_worker.read_text(encoding="utf-8")
          assert 'const CACHE_NAME = "vereda-offline-v955";' in sw_text
          assert old_version in sw_text, "versão anterior ausente no service worker"
          sw_text = sw_text.replace('const CACHE_NAME = "vereda-offline-v955";', 'const CACHE_NAME = "vereda-offline-v956";')
          sw_text = sw_text.replace(old_version, new_version)
          for source_name, target_name in moves.items():
              assert source_name in sw_text, f"consumidor ausente no service worker: {source_name}"
              sw_text = sw_text.replace(source_name, target_name)
          service_worker.write_text(sw_text, encoding="utf-8")

          dialog = Path("ui-dialog.js")
          dialog_text = dialog.read_text(encoding="utf-8")
          assert old_version in dialog_text, "carregador dinâmico não contém a versão anterior"
          dialog.write_text(dialog_text.replace(old_version, new_version), encoding="utf-8")

          decision = Path("docs/_decisoes/PILOTO_ESTRUTURA_JS_CONTROLLERS_2026-07-25.md")
          decision.write_text(
              """# Piloto estrutural — controladores JavaScript\n\n"
              "Data: 2026-07-25\n\n"
              "## Decisão\n\n"
              "Mover um primeiro grupo pequeno de controladores de interface para `js/controllers/`, sem refatorar comportamento.\n\n"
              "## Arquivos\n\n"
              "- `tooltip-controller.js` → `js/controllers/tooltip-controller.js`;\n"
              "- `pomodoro-controller.js` → `js/controllers/pomodoro-controller.js`;\n"
              "- `reader-controller.js` → `js/controllers/reader-controller.js`.\n\n"
              "## Consumidores atualizados\n\n"
              "- `index.html`;\n"
              "- `service-worker.js`;\n"
              "- versionamento dinâmico em `ui-dialog.js`.\n\n"
              "## Limites\n\n"
              "Nenhuma função, variável global, ordem de carregamento, chave de armazenamento ou comportamento de interface foi alterado.\n\n"
              "## Evidência mínima\n\n"
              "- sintaxe JavaScript verificada nos três destinos;\n"
              "- caminhos antigos ausentes dos consumidores executáveis;\n"
              "- novos caminhos servidos por HTTP;\n"
              "- coerência entre a versão dos assets e o cache do service worker.\n"
              """,
              encoding="utf-8",
          )

          root_decision = Path("docs/_decisoes/ESTRUTURA_RAIZ.md")
          root_text = root_decision.read_text(encoding="utf-8")
          note = "\n## Piloto de controladores — 2026-07-25\n\nTrês controladores de baixo acoplamento foram migrados para `js/controllers/` em um lote isolado. A migração física não incluiu refatoração comportamental.\n"
          if "## Piloto de controladores — 2026-07-25" not in root_text:
              root_decision.write_text(root_text.rstrip() + "\n" + note, encoding="utf-8")
          PY

      - name: Validar caminhos, sintaxe, cache e serviço local
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tooltip-controller.js
          test ! -e pomodoro-controller.js
          test ! -e reader-controller.js
          test -f js/controllers/tooltip-controller.js
          test -f js/controllers/pomodoro-controller.js
          test -f js/controllers/reader-controller.js

          node --check js/controllers/tooltip-controller.js
          node --check js/controllers/pomodoro-controller.js
          node --check js/controllers/reader-controller.js
          node --check ui-dialog.js
          node --check service-worker.js

          grep -F 'js/controllers/tooltip-controller.js?v=20260725-js-controllers-pilot-v1' index.html
          grep -F 'js/controllers/pomodoro-controller.js?v=20260725-js-controllers-pilot-v1' index.html
          grep -F 'js/controllers/reader-controller.js?v=20260725-js-controllers-pilot-v1' index.html
          grep -F './js/controllers/tooltip-controller.js?v=${ASSET_VERSION}' service-worker.js
          grep -F './js/controllers/pomodoro-controller.js?v=${ASSET_VERSION}' service-worker.js
          grep -F './js/controllers/reader-controller.js?v=${ASSET_VERSION}' service-worker.js
          grep -F 'const CACHE_NAME = "vereda-offline-v956";' service-worker.js
          grep -F 'const ASSET_VERSION = "20260725-js-controllers-pilot-v1";' service-worker.js

          python scripts/auditor-asset-version.py

          python -m http.server 8799 > /tmp/escrevaral-controller-pilot.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for tentativa in {1..20}; do
            curl -fsS http://127.0.0.1:8799/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8799/js/controllers/tooltip-controller.js > /dev/null
          curl -fsS http://127.0.0.1:8799/js/controllers/pomodoro-controller.js > /dev/null
          curl -fsS http://127.0.0.1:8799/js/controllers/reader-controller.js > /dev/null

      - name: Restaurar workflow e gravar somente a migração
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/release-candidate-argila.yml > .github/workflows/release-candidate-argila.yml
          git config user.name "Escrevaral Structural Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nenhuma alteração para gravar"; exit 1; }
          git commit -m "refactor(structure): organizar controladores em js/controllers"
          git push origin HEAD:agent/js-controllers-pilot
