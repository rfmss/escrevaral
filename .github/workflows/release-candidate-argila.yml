name: Migração isolada de controladores de interface

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrar:
    if: github.head_ref == 'agent/js-controllers-ux-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Migrar lote e validar
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          test -f editor-status-controller.js
          test -f oficina-navigation-controller.js
          test -f training-controller.js

          mkdir -p js/controllers
          git mv editor-status-controller.js js/controllers/editor-status-controller.js
          git mv oficina-navigation-controller.js js/controllers/oficina-navigation-controller.js
          git mv training-controller.js js/controllers/training-controller.js

          python3 - <<'PY'
          from pathlib import Path

          old_version = "20260725-js-controllers-pilot-v1"
          new_version = "20260726-js-controllers-ui-v1"

          moves = {
              "editor-status-controller.js": "js/controllers/editor-status-controller.js",
              "oficina-navigation-controller.js": "js/controllers/oficina-navigation-controller.js",
              "training-controller.js": "js/controllers/training-controller.js",
          }

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          assert old_version in index
          index = index.replace(old_version, new_version)
          for old, new in moves.items():
              marker = f'src="{old}?v='
              assert marker in index, marker
              index = index.replace(marker, f'src="{new}?v=')
          index_path.write_text(index, encoding="utf-8")

          sw_path = Path("service-worker.js")
          sw = sw_path.read_text(encoding="utf-8")
          assert 'const CACHE_NAME = "vereda-offline-v956";' in sw
          assert f'const ASSET_VERSION = "{old_version}";' in sw
          sw = sw.replace('const CACHE_NAME = "vereda-offline-v956";', 'const CACHE_NAME = "vereda-offline-v957";')
          sw = sw.replace(f'const ASSET_VERSION = "{old_version}";', f'const ASSET_VERSION = "{new_version}";')
          sw = sw.replace(old_version, new_version)
          for old, new in moves.items():
              marker = f'`./{old}?v=${{ASSET_VERSION}}`'
              assert marker in sw, marker
              sw = sw.replace(marker, f'`./{new}?v=${{ASSET_VERSION}}`')
          sw_path.write_text(sw, encoding="utf-8")

          dialog_path = Path("ui-dialog.js")
          dialog = dialog_path.read_text(encoding="utf-8")
          assert old_version in dialog
          dialog_path.write_text(dialog.replace(old_version, new_version), encoding="utf-8")

          workflow_updates = {
              Path(".github/workflows/editor-status-argila-pr.yml"): moves["editor-status-controller.js"],
              Path(".github/workflows/oficina-navigation-pr.yml"): moves["oficina-navigation-controller.js"],
          }
          for path, new_path in workflow_updates.items():
              text = path.read_text(encoding="utf-8")
              old_name = Path(new_path).name
              assert old_name in text, (path, old_name)
              path.write_text(text.replace(old_name, new_path), encoding="utf-8")

          root_decision = Path("docs/_decisoes/ESTRUTURA_RAIZ.md")
          root_text = root_decision.read_text(encoding="utf-8")
          addition = """

## Segundo lote de controladores — 2026-07-26

Mais três controladores de interface foram migrados para `js/controllers/` em um lote isolado. Os workflows especializados que validam situação do editor e navegação da Oficina foram atualizados junto; nenhuma lógica de produto foi refatorada.
"""
          if "## Segundo lote de controladores — 2026-07-26" not in root_text:
              root_decision.write_text(root_text.rstrip() + addition, encoding="utf-8")

          evidence = """# Segundo lote estrutural — controladores de interface

Data: 2026-07-26

## Decisão

Mover um novo grupo pequeno de controladores para `js/controllers/`, mantendo conteúdo, ordem de carregamento e comportamento.

## Arquivos

- `editor-status-controller.js` → `js/controllers/editor-status-controller.js`;
- `oficina-navigation-controller.js` → `js/controllers/oficina-navigation-controller.js`;
- `training-controller.js` → `js/controllers/training-controller.js`.

## Consumidores atualizados

- `index.html`;
- `service-worker.js`;
- `ui-dialog.js`, apenas para coerência da versão global;
- `.github/workflows/editor-status-argila-pr.yml`;
- `.github/workflows/oficina-navigation-pr.yml`.

## Limites

Nenhuma função, variável global, chave de armazenamento, evento, ordem de script ou comportamento de interface foi alterado.

## Evidência mínima

- conteúdos preservados pelo `git mv`;
- sintaxe dos três destinos verificada;
- referências executáveis atualizadas;
- novos caminhos servidos por HTTP;
- coerência de versão e cache validada.
"""
          Path("docs/_decisoes/PILOTO_ESTRUTURA_JS_CONTROLLERS_UI_2026-07-26.md").write_text(evidence, encoding="utf-8")
          PY

          node --check js/controllers/editor-status-controller.js
          node --check js/controllers/oficina-navigation-controller.js
          node --check js/controllers/training-controller.js

          test ! -e editor-status-controller.js
          test ! -e oficina-navigation-controller.js
          test ! -e training-controller.js

          grep -F 'js/controllers/editor-status-controller.js' index.html service-worker.js .github/workflows/editor-status-argila-pr.yml
          grep -F 'js/controllers/oficina-navigation-controller.js' index.html service-worker.js .github/workflows/oficina-navigation-pr.yml
          grep -F 'js/controllers/training-controller.js' index.html service-worker.js

          python scripts/auditor-asset-version.py

          python3 -m http.server 8799 >/tmp/escrevaral-controller-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for tentativa in {1..20}; do
            if curl -fsS http://127.0.0.1:8799/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8799/js/controllers/editor-status-controller.js >/dev/null
          curl -fsS http://127.0.0.1:8799/js/controllers/oficina-navigation-controller.js >/dev/null
          curl -fsS http://127.0.0.1:8799/js/controllers/training-controller.js >/dev/null

          git diff --check

          git checkout origin/main -- .github/workflows/release-candidate-argila.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(structure): ampliar organização de controladores"
          git push origin HEAD:${{ github.head_ref }}
