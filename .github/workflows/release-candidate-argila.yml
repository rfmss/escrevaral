name: Aplicar lote estrutural validado

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    if: github.head_ref == 'agent/js-controllers-ux-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar branch do piloto
        uses: actions/checkout@v4.2.2
        with:
          ref: agent/js-controllers-ux-pilot
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Aplicar e gravar lote
        id: commit
        shell: bash
        run: |
          set +e
          {
            set -x
            python scripts/migrar-controladores-ui-pilot.py
            git checkout origin/main -- scripts/auditor-nomenclatura-publica.py
            git restore --source=HEAD --staged --worktree \
              .github/workflows/editor-status-argila-pr.yml \
              .github/workflows/oficina-navigation-pr.yml
            git restore --source=HEAD --staged --worktree reports/ || true
            git clean -fd reports/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git status --short
            git add --all -- \
              index.html \
              service-worker.js \
              ui-dialog.js \
              scripts/auditor-nomenclatura-publica.py \
              docs/_decisoes/ESTRUTURA_RAIZ.md \
              docs/_decisoes/PILOTO_ESTRUTURA_JS_CONTROLLERS_UI_2026-07-26.md \
              js/controllers/editor-status-controller.js \
              js/controllers/oficina-navigation-controller.js \
              js/controllers/training-controller.js \
              editor-status-controller.js \
              oficina-navigation-controller.js \
              training-controller.js
            git diff --cached --check
            git status --short
            git diff --cached --stat
            git commit -m "refactor(structure): ampliar organização de controladores"
            git push origin HEAD:agent/js-controllers-ux-pilot
          } > /tmp/aplicar-lote.log 2>&1
          code=$?
          cat /tmp/aplicar-lote.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guardar log de aplicação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aplicar-lote-${{ github.run_id }}
          path: /tmp/aplicar-lote.log
          retention-days: 14

      - name: Confirmar aplicação
        env:
          EXIT_CODE: ${{ steps.commit.outputs.exit_code }}
        run: test "$EXIT_CODE" = "0"
