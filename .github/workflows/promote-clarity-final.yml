name: Promover revisão visual final

on:
  push:
    branches:
      - stabilize/clarity-finish
    paths:
      - ".github/workflows/promote-clarity-final.yml"

permissions:
  contents: write

jobs:
  promover:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar branch
        uses: actions/checkout@v4.2.2
        with:
          ref: stabilize/clarity-finish
          fetch-depth: 0

      - name: Promover identificadores de distribuição
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "20260725-clarity-final-v1"
          new = "20260725-clarity-final-v2"
          files = [
              Path("index.html"),
              Path("service-worker.js"),
              Path("ui-dialog.js"),
              Path("styles.css"),
              Path("workshop-authorship-clarity-controller.js"),
          ]

          total = 0
          for path in files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"versão anterior ausente em {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")
              total += count
              print(f"{path}: {count} ocorrência(s)")

          sw = Path("service-worker.js").read_text(encoding="utf-8")
          if 'const CACHE_NAME = "vereda-offline-v953";' not in sw:
              raise SystemExit("cache final não está em v953")
          if f'const ASSET_VERSION = "{new}";' not in sw:
              raise SystemExit("ASSET_VERSION final não foi aplicado")

          Path(".github/workflows/promote-clarity-final.yml").unlink()
          print(f"promoção concluída: {total} referências atualizadas")
          PY

      - name: Validar coerência local
        run: GITHUB_BASE_REF=main python scripts/auditor-asset-version.py

      - name: Registrar promoção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js ui-dialog.js styles.css workshop-authorship-clarity-controller.js .github/workflows/promote-clarity-final.yml
          git commit -m "chore(release): promover clarity-final-v2"
          git push origin HEAD:stabilize/clarity-finish
