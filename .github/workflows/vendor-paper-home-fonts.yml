name: Vendor Paper Home Fonts

on:
  push:
    branches: [feat/escrevaral-paper-home]
    paths:
      - ".github/workflows/vendor-paper-home-fonts.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Baixar e verificar fontes oficiais
        run: |
          set -euo pipefail
          fonts="mass-notes-next/src/assets/fonts"
          mkdir -p "$fonts"

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf" \
            -o "$fonts/Anton-Regular.ttf"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/oswald/Oswald%5Bwght%5D.ttf" \
            -o "$fonts/Oswald-wght.ttf"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/literata/Literata%5Bopsz%2Cwght%5D.ttf" \
            -o "$fonts/Literata-opsz-wght.ttf"

          test "$(git hash-object "$fonts/Anton-Regular.ttf")" = "4d65707db9d8663ccfa99cd28cd3a4e0025be178"
          test "$(git hash-object "$fonts/Oswald-wght.ttf")" = "d1a3b9cb1325bf20b3a06ef9849d21c411212a3b"
          test "$(git hash-object "$fonts/Literata-opsz-wght.ttf")" = "0a81b4984a4a4eb101e0ddc28babc85bb137efef"

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/anton/OFL.txt" \
            -o "$fonts/OFL-Anton.txt"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/oswald/OFL.txt" \
            -o "$fonts/OFL-Oswald.txt"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/literata/OFL.txt" \
            -o "$fonts/OFL-Literata.txt"

          test "$(git hash-object "$fonts/OFL-Anton.txt")" = "93feddee37145696e123ea65a6772cab09663f9e"
          test "$(git hash-object "$fonts/OFL-Oswald.txt")" = "4d4e319b6114be0174e6de5d8090408f78dc65b8"
          test "$(git hash-object "$fonts/OFL-Literata.txt")" = "9d3b4e3b1e9068fbda799f57833ff831d05cc271"

          cat > "$fonts/PROVENANCE.md" <<'EOF'
          # Paper Home font provenance

          Vendored from the official `google/fonts` repository for offline runtime use.

          | Local file | Official source | Verified Git blob |
          | --- | --- | --- |
          | `Anton-Regular.ttf` | `ofl/anton/Anton-Regular.ttf` | `4d65707db9d8663ccfa99cd28cd3a4e0025be178` |
          | `Oswald-wght.ttf` | `ofl/oswald/Oswald[wght].ttf` | `d1a3b9cb1325bf20b3a06ef9849d21c411212a3b` |
          | `Literata-opsz-wght.ttf` | `ofl/literata/Literata[opsz,wght].ttf` | `0a81b4984a4a4eb101e0ddc28babc85bb137efef` |

          The matching SIL Open Font License text for each family is stored beside the binary as `OFL-*.txt` and is verified against the official repository as part of the bootstrap.
          EOF

      - name: Commitar ativos e remover bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/vendor-paper-home-fonts.yml
          git add -A
          git commit -m "chore: vendorizar tipografia OFL da Paper Home"
          git push origin HEAD:feat/escrevaral-paper-home
